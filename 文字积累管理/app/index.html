<script>
/* ================= 常量 / 状态 ================= */
const S = { tags: [], sentences: [], notes: [] };
let curSeg = 'all';
let curTag = '';
let editingNoteId = null;
let editingSentId = null;
let editingEditId = null;
let scomposing = false; // 搜索框输入法组合中，避免重建打断中文输入

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nowStr() { const d = new Date(); const p = n => String(n).padStart(2,'0'); return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()); }

function toast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--drawer-bg-top);color:var(--drawer-text);padding:10px 20px;border-radius:10px;font-size:13px;z-index:99999;animation:msgIn .3s var(--ease);box-shadow:var(--shadow-overlay);';
  t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ================= 后端请求 ================= */
async function api(path, method = 'GET', body) {
  const opts = { method };
  if (body !== undefined) { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(body); }
  const resp = await fetch('/api' + path, opts);
  return resp.json();
}

async function loadData() {
  const r = await api('/init');
  if (r.ok) { S.tags = r.store.tags || []; S.sentences = r.store.sentences || []; S.notes = r.store.notes || []; }
}

/* ================= 主题 ================= */
const THEME_KEY = 'wenzi-theme';
function getTheme() { try { return localStorage.getItem(THEME_KEY) || 'light'; } catch(e){ return 'light'; } }
function setTheme(t) { try { localStorage.setItem(THEME_KEY, t); } catch(e){} applyTheme(t); }
function applyTheme(t) {
  const on = t === 'dark';
  if (on) document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  const el = $('#themeLabel'); if (el) el.textContent = on ? '浅色' : '深色';
}

/* ================= 页面导航 ================= */
function switchPage(page) {
  $$('.page').forEach(p => p.classList.remove('active'));
  $$('.navi').forEach(n => n.classList.remove('active'));
  const pe = $('#page-' + page); if (pe) pe.classList.add('active');
  const ne = document.querySelector('.navi[data-page="' + page + '"]'); if (ne) ne.classList.add('active');
  ({ home: renderHome, sent: renderSents, note: renderNotes, tag: renderTags, ai: renderAI, set: renderSet })[page]();
}

/* ================= 图表 ================= */
/* 柔和配色（青瓷 · 竹韵系）：内置印鉴直接取柔和色，用户自定义色一律降饱和 */
const SOFT = { 诗词:'#5a9e8a', 古文:'#5a8a9e', 名言:'#8a7c5a', 增广贤文:'#5f8a6d',
  成语典故:'#7a6f9e', 文学理论:'#9e7a5a', 原创:'#5a9a84' };
function soften(hex) {
  const m = String(hex || '').replace(/^#/, '');
  if (!/^[0-9a-fA-F]{6}$/.test(m)) return '#6f847e';
  const r = parseInt(m.substr(0,2),16)/255, g = parseInt(m.substr(2,2),16)/255, b = parseInt(m.substr(4,2),16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2, d = mx-mn;
  let s = 0, h = 0;
  if (d > 0) { s = d / (1 - Math.abs(2*l-1));
    if (mx===r) h=((g-b)/d)%6; else if (mx===g) h=(b-r)/d+2; else h=(r-g)/d+4;
    h = (h*60 + 360) % 360; }
  s *= 0.5; const l2 = Math.min(l, 0.9);
  const c = (1-Math.abs(2*l2-1))*s, hp = h/60, x = c*(1-Math.abs(hp%2-1)), mm = l2-c/2;
  let r0,g0,b0;
  if (hp<1){r0=c;g0=x;b0=0;} else if (hp<2){r0=x;g0=c;b0=0;}
  else if (hp<3){r0=0;g0=c;b0=x;} else if (hp<4){r0=0;g0=x;b0=c;}
  else if (hp<5){r0=x;g0=0;b0=c;} else {r0=c;g0=0;b0=x;}
  const to = n => { const v = Math.round((n+mm)*255); return v.toString(16).padStart(2,'0'); };
  return '#' + to(r0) + to(g0) + to(b0);
}
function tagColor(name) {
  if (SOFT[name]) return SOFT[name];
  const t = S.tags.find(x => x.name === name);
  return t && t.color ? soften(t.color) : '#6f847e';
}

function donutSVG(items, size) {
  size = size || 190; const r = (size / 2) - 12, cx = size / 2, cy = size / 2, C = 2 * Math.PI * r;
  const total = items.reduce((a, x) => a + x.value, 0) || 1;
  let acc = 0;
  const arcs = items.map(x => {
    const frac = x.value / total;
    const off = acc; acc += frac;
    if (frac <= 0) return '';
    return '<circle r="' + r + '" cx="' + cx + '" cy="' + cy + '" fill="none" stroke="' + x.color +
      '" stroke-width="22" stroke-dasharray="' + (frac * C) + ' ' + C + '" stroke-dashoffset="' + (-off * C) +
      '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
  }).join('');
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="flex:0 0 auto">' + arcs +
    '<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" font-size="26" font-weight="800" fill="var(--text)" font-family="var(--font-serif)">' + total + '</text>' +
    '<text x="' + cx + '" y="' + (cy + 20) + '" text-anchor="middle" font-size="11" fill="var(--text-tertiary)">词句</text></svg>';
}

function tagCounts() {
  const m = {}; S.sentences.forEach(s => (s.tags || []).forEach(t => m[t] = (m[t] || 0) + 1));
  return m;
}

function last7() {
  const map = {};
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i);
    const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); map[k] = 0; }
  S.sentences.forEach(s => { const d = (s.created || '').slice(0, 10); if (d in map) map[d]++; });
  return Object.entries(map);
}

/* 近七日趋势折线图（SVG） */
function trendSVG(items) {
  const W = 560, H = 150, PAD = 8, BOT = 22;
  const max = Math.max(...items.map(x => x[1]), 1);
  const len = items.length;
  const xs = i => PAD + (len === 1 ? W / 2 : i * (W - PAD * 2) / (len - 1));
  const ys = v => PAD + BOT + (H - BOT - PAD) * (1 - v / max);
  let pts = items.map((x, i) => [xs(i), ys(x[1])]);
  // 平滑曲线（Catmull-Rom -> 三次贝塞尔）
  let d = '';
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], p0 = pts[i - 1] || p, p1 = pts[i + 1] || p, p2 = pts[i + 2] || p1;
    const cx = p[0] + (p1[0] - p0[0]) / 6, cy = p[1] + (p1[1] - p0[1]) / 6;
    const cx2 = p1[0] - (p2[0] - p[0]) / 6, cy2 = p1[1] - (p2[1] - p[1]) / 6;
    d += (i === 0 ? 'M' : 'C') + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + cx2.toFixed(1) + ' ' + cy2.toFixed(1) + ' ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1);
  }
  const area = d + ' L' + pts[len - 1][0].toFixed(1) + ' ' + (H - 1) + ' L' + pts[0][0].toFixed(1) + ' ' + (H - 1) + ' Z';
  const gid = 'tg' + (trendSVG._n = (trendSVG._n || 0) + 1);
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="var(--accent)" stop-opacity=".32"/>' +
      '<stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + area + '" fill="url(#' + gid + ')"/>' +
    '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
    pts.map((p, i) => '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="var(--surface-card)" stroke="var(--accent)" stroke-width="2"/>' +
      '<text x="' + p[0].toFixed(1) + '" y="' + (p[1].toFixed(0) - 9) + '" text-anchor="middle" font-size="11" fill="var(--text-tertiary)">' + items[i][1] + '</text>').join('') +
    '</svg>' +
    '<div class="trend-axis">' + items.map(x => '<span>' + x[0].slice(5) + '</span>').join('') + '</div>';
}

function sourceTop(n) {
  const m = {};
  S.sentences.forEach(s => { const k = (s.source || s.author || (s.tags && s.tags[0]) || '佚名').trim() || '佚名'; m[k] = (m[k] || 0) + 1; });
  return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, n || 5);
}

function charCloud(n) {
  const stop = new Set('的了在是我你他她它和与不只小大。，、！？；：\u201C\u201D\u2018\u2019《》【】…·—-年月日甲乙丙丁子丑寅卯');
  const m = {};
  S.sentences.forEach(s => { for (const ch of (s.text || '')) { if (!/[\u4e00-\u9fff]/.test(ch) || stop.has(ch)) continue; m[ch] = (m[ch] || 0) + 1; } });
  return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, n || 40);
}

/* ================= 首页 ================= */
function renderHome() {
  const el = $('#page-home');
  const total = S.sentences.length, notes = S.notes.length, favs = S.sentences.filter(s => s.favorite).length;
  const tcounts = tagCounts();
  const tagItems = S.tags.map(t => ({ name: t.name, color: tagColor(t.name), value: tcounts[t.name] || 0 })).filter(x => x.value > 0);
  const daily = total ? S.sentences[(Date.now() / 86400000 | 0) % total] : null;
  const bars = last7();
  const tops = sourceTop(5);
  const topMax = Math.max(...tops.map(x => x[1]), 1);
  const cloud = charCloud(42);
  const cloudBase = Math.max(...cloud.map(x => x[1]), 1);

  el.innerHTML = `
    <div class="daily">
      <div class="q-tag">每日一句 · 温故知新</div>
      <div class="q-text">${daily ? esc(daily.text) : '择一句，积一寸，聚之成裘。'}</div>
      <div class="q-src">${daily ? esc(daily.source || '') + (daily.author ? ' · ' + esc(daily.author) : '') : ''}</div>
    </div>

    <div class="grid-4" style="margin-top:16px">
      <div class="stat-card" style="--c:var(--accent)"><div class="num">${total}</div><div class="lab">累计词句</div><div class="trend">其中收藏 ${favs} 句</div></div>
      <div class="stat-card" style="--c:var(--module-2)"><div class="num">${S.tags.length}</div><div class="lab">印鉴分类</div><div class="trend">${tagItems.length} 类在用</div></div>
      <div class="stat-card" style="--c:var(--module-4)"><div class="num">${notes}</div><div class="lab">札记</div><div class="trend">长文随想</div></div>

/* ================= 词句库 ================= */
function renderSentShell() {
  $('#page-sent').innerHTML = `
    <div class="header">
      <div><h2>词句</h2><p>共 <span id="sentCount">${S.sentences.length}</span> 句 · ${S.tags.length} 印鉴</p></div>
      <button class="btn primary" onclick="openAdd()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>记一句</button>
    </div>
    <div class="toolbar">
      <div class="search-box"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="sSearch" placeholder="检索词句 / 出处 / 作者" autocomplete="off" oninput="renderSents()"></div>
      <div class="seg" style="flex:0 0 auto">
        <button id="segAll" onclick="setSeg('all')">全部</button>
        <button id="segFav" onclick="setSeg('fav')">心珍</button>
      </div>
    </div>
    <div id="sentChips" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px"></div>
    <div id="sentList" class="sent-group"></div>`;
}
function renderSents() {
  if (!document.getElementById('sentList')) renderSentShell();
  const kw = document.getElementById('sSearch').value;
  const a = document.getElementById('segAll'), f = document.getElementById('segFav');
  if (a) a.classList.toggle('on', curSeg === 'all');
  if (f) f.classList.toggle('on', curSeg === 'fav');
  document.getElementById('sentCount').textContent = S.sentences.length;

  let list = S.sentences.slice().sort((a2, b2) => (b2.created || '').localeCompare(a2.created || ''));
  if (curTag) list = list.filter(s => (s.tags || []).includes(curTag));
  if (curSeg === 'fav') list = list.filter(s => s.favorite);
  if (kw) list = list.filter(s => (s.text || '').includes(kw) || (s.source || '').includes(kw) || (s.author || '').includes(kw));

  const filtering = curTag || curSeg === 'fav' || kw;
  const chipEl = document.getElementById('sentChips');
  if (chipEl) chipEl.innerHTML = `<span style="font-size:12px;color:var(--text-tertiary);align-self:center">印鉴 · </span>` +
    S.tags.map(t => `<span class="chip ${curTag === t.name ? 'on' : ''}" style="${curTag === t.name ? 'background:' + tagColor(t.name) : ''}"
      onclick="setTag('${esc(t.name)}')">${esc(t.name)}</span>`).join('');

  const groups = [];
  if (filtering) {
    groups.push({ name: curTag || (curSeg === 'fav' ? '心珍藏品' : '检索结果'), items: list, color: curTag ? tagColor(curTag) : '#5a9e8a' });
  } else {
    S.tags.forEach(t => { const it = list.filter(s => (s.tags || []).includes(t.name)); if (it.length) groups.push({ name: t.name, items: it, color: tagColor(t.name) }); });
    const loose = list.filter(s => !(s.tags || []).length);
    if (loose.length) groups.push({ name: '未落印', items: loose, color: 'rgba(150,160,150,.45)' });
  }

  document.getElementById('sentList').innerHTML = groups.length ? groups.map(g => `
    <div class="group-card">
      <div class="gc-head"><span class="gc-dot" style="background:${g.color}"></span>
        <span class="gc-name">${esc(g.name)}</span><span class="gc-count">${g.items.length} 句</span></div>
      <div class="gc-body">${g.items.map(s => `
        <div class="sent">
          <div class="txt" onclick="openSentNote('${s.id}')" title="点开维护随笔札记">${esc(s.text)}
            <div class="meta"><span class="src">${esc(s.source || '')}${s.source && s.author ? ' · ' : ''}${esc(s.author || '')}</span>
              <span class="tags">${(s.tags || []).map(t => `<span class="tag-mini" style="background:${tagColor(t)}">${esc(t)}</span>`).join('')}
              ${s.sentNote ? `<span class="tag-mini note-tag">◬ 随笔</span>` : ''}</span></div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;flex:0 0 auto">
            <button class="icon-btn" title="改一句" onclick="event.stopPropagation();openEdit('${s.id}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
            <button class="icon-btn ${s.sentNote ? 'note-on' : ''}" title="随笔札记" onclick="event.stopPropagation();openSentNote('${s.id}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></button>
            <button class="icon-btn ${s.favorite ? 'liked' : ''}" title="收藏" onclick="event.stopPropagation();flipFav('${s.id}')">
              <svg viewBox="0 0 24 24" fill="${s.favorite ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.7"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
            <button class="icon-btn" title="删除" onclick="event.stopPropagation();delSent('${s.id}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button>
          </div>
        </div>`).join('')}
      </div>
    </div>`).join('') : `<div class="empty">此处暂无词句</div>`;
}
function setTag(n) { curTag = curTag === n ? '' : n; renderSents(); }
function setSeg(s) { curSeg = s; renderSents(); }
async function flipFav(id) {
  const r = await api('/sentences/fav/' + id, 'POST'); if (r.ok) { const s = S.sentences.find(x => x.id === id); if (s) s.favorite = !s.favorite; renderSents(); toast('已' + (s && s.favorite ? '收藏' : '取消收藏')); }
}
async function delSent(id) { if (!confirm('删除这句词？')) return; const r = await api('/sentences/del/' + id, 'POST'); if (r.ok) { S.sentences = S.sentences.filter(x => x.id !== id); renderSents(); toast('已删'); } }

/* 句随笔 */
function openSentNote(id) {
  editingSentId = id;
  const s = S.sentences.find(x => x.id === id);
  if (!s) return;
  $('#sentNoteView').innerHTML =
    '<div>' + esc(s.text) + '</div>' +
    '<div class="sn-meta">' + esc(s.source || '') + (s.source && s.author ? ' · ' : '') + esc(s.author || '') + '</div>';
  $('#sentNoteContent').value = s.sentNote || '';
  $('#sentNoteModal').classList.add('on');
  $('#sentNoteContent').focus();
}
const saveSentNote = async () => {
  if (!editingSentId) return;
  const r = await api('/sentences/note', 'POST', { id: editingSentId, note: $('#sentNoteContent').value });
  if (r.ok) { const s = S.sentences.find(x => x.id === editingSentId); if (s) s.sentNote = r.sentNote; renderSents(); $('#sentNoteModal').classList.remove('on'); toast('随笔已保存'); }
  else toast(r.msg || '保存失败');
};

/* 改一句 */
function openEdit(id) {
  editingEditId = id;
  const s = S.sentences.find(x => x.id === id);
  if (!s) return;
  $('#editText').value = s.text || '';
  $('#editSource').value = s.source || '';
  $('#editAuthor').value = s.author || '';
  const cur = s.tags || [];
  $('#editTags').innerHTML = S.tags.map(t =>
    `<span class="chip ${cur.includes(t.name) ? 'on' : ''}" data-tag="${esc(t.name)}"
      style="${cur.includes(t.name) ? 'background:' + tagColor(t.name) + ';color:#fff' : ''}"
      onclick="this.classList.toggle('on'); this.style.background=this.classList.contains('on')?'${tagColor(t.name)}':''; this.style.color=this.classList.contains('on')?'#fff':''">${esc(t.name)}</span>`
  ).join('');
  $('#editModal').classList.add('on');
}
const saveEdit = async () => {
  if (!editingEditId) return;
  const text = $('#editText').value.trim(); if (!text) { toast('请填写内容'); return; }
  const tags = Array.from($$('#editTags .chip.on')).map(c => c.dataset.tag);
  const r = await api('/sentences/update', 'POST', {
    id: editingEditId, text, source: $('#editSource').value.trim(),
    author: $('#editAuthor').value.trim(), tags });
  if (r.ok) {
    const i = S.sentences.findIndex(x => x.id === editingEditId);
    if (i >= 0) S.sentences[i] = r.sentence;
    renderSents(); renderHome(); $('#editModal').classList.remove('on'); toast('已保存修改');
  } else toast(r.msg || '保存失败');
};

/* ================= 札记 ================= */
function renderNotes() {
  $('#page-note').innerHTML = `
    <div class="header"><div><h2>札记</h2><p>写长长随想</p></div>
      <button class="btn primary" onclick="openNote()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>写札记</button></div>
    <div class="note-grid">${S.notes.length ? S.notes.map(n => `
      <div class="note-item" onclick="openNote('${n.id}')">
        <div class="n-title">${esc(n.title)}</div><div class="n-time">${esc(n.updated || n.created || '')}</div>
        <div class="n-preview">${mdPreview(n.content, 120)}</div></div>`).join('')
      : '<div class="empty" style="grid-column:1/-1">此处暂无札记</div>'}</div>
  `;
}
function mdPreview(src, len) {
  const s = String(src || '');
  const cut = s.length > len ? s.slice(0, len) + '…' : s;
  return mdToHtml(cut);
}
async function openNote(nid) {
  editingNoteId = nid || null;
  const n = nid ? S.notes.find(x => x.id === nid) : null;
  $('#noteTitle').value = n ? n.title : ''; $('#noteContent').value = n ? n.content : '';
  noteTab('edit');
  $('#noteModal').classList.add('on');
}
function noteTab(mode) {
  const edit = document.getElementById('noteContent'), prev = document.getElementById('notePreview');
  const b1 = document.getElementById('noteTabEdit'), b2 = document.getElementById('noteTabPrev');
  if (!edit || !prev || !b1 || !b2) return;
  if (mode === 'prev') {
    prev.innerHTML = mdToHtml(edit.value);
    edit.style.display = 'none'; prev.style.display = 'block';
    b1.classList.remove('on'); b2.classList.add('on');
    b1.style.background = ''; b2.style.background = 'var(--accent)';
  } else {
    edit.style.display = 'block'; prev.style.display = 'none';
    b1.classList.add('on'); b2.classList.remove('on');
    b1.style.background = 'var(--accent)'; b2.style.background = '';
  }
}
const saveNote = async () => {
  const title = $('#noteTitle').value.trim(); if (!title) { toast('请填写标题'); return; }
  const r = await api('/notes', 'POST', { id: editingNoteId, title, content: $('#noteContent').value, new: !editingNoteId });
  if (r.ok) { await loadData(); renderNotes(); $('#noteModal').classList.remove('on'); toast('已保存'); }
};
const delNote = async () => { if (!editingNoteId || !confirm('删除这篇札记？')) return; await api('/notes', 'DELETE', { id: editingNoteId }); await loadData(); renderNotes(); $('#noteModal').classList.remove('on'); toast('已删'); };

function promptListHTML() {

function refreshPrompts() { const el = document.getElementById('promptList'); if (el) el.innerHTML = promptListHTML(); }
function applyPrompt(i) { const ps = getAIPrompts(); const ta = document.getElementById('aiPrompt'); if (ta) { ta.value = ps[i].text; toast('已写入人设框，记得点「保存设置」'); } }
function editPrompt(i) { promptEdit = i; refreshPrompts(); }
function delPrompt(i) { if (!confirm('删除这条提示词？')) return; const ps = getAIPrompts(); ps.splice(i, 1); saveAIPrompts(ps); promptEdit = null; refreshPrompts(); }
function addPrompt() { const ps = getAIPrompts(); ps.push({ name: '新提示词', text: '' }); saveAIPrompts(ps); promptEdit = ps.length - 1; refreshPrompts(); const el = document.getElementById('peName'); if (el) el.focus(); }
function peSave(i) {

/* ================= 悬浮 AI 对话 ================= */
let aiMsgs = [];
let aiBusy = false;
async function ensureAI() {
  const c = getAICfg();
  if (!c.endpoint) {
    const el = $('#aiMsgs');
    el.classList.add('cfg-missing');
    el.innerHTML = '<div class="ai-hint">尚未配置 AI 连接<br>请先到「AI 道场」填入端点与密钥<button class="btn primary" onclick="switchPage(\'ai\')">去配置</button></div>';
    return;
  }
}
function aiEndpoint(c) {
  return c.endpoint.endsWith('/chat/completions') ? c.endpoint : c.endpoint.replace(/\/$/, '') + '/chat/completions';
}
async function aiFetchOnce(c, body, onDelta) {
  const resp = await fetch(aiEndpoint(c), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (c.key || '') },
    body: JSON.stringify(body),
  });
  if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + await resp.text());
  const ct = (resp.headers.get('content-type') || '').toLowerCase();
  if (!ct.includes('text/event-stream')) {
    const data = await resp.json();
    let content = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
    if (Array.isArray(content)) content = content.map(x => (x && (x.text || x.content)) || '').join('');
    if (typeof content !== 'string') content = '';
    if (content) { if (onDelta) onDelta(content); return content; }
    return '';
  }
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  let reply = '';
  const flush = () => {
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const part of parts) {
      const line = part.split('\n').find(l => l.trimStart().startsWith('data:'));
      if (!line) continue;
      const data = line.slice(line.indexOf('data:') + 5).trim();
      if (data === '[DONE]') continue;
      try {
        const j = JSON.parse(data);
        const delta = j.choices && j.choices[0] && j.choices[0].delta ? (j.choices[0].delta.content || '') : '';
        if (delta) { reply += delta; if (onDelta) onDelta(reply); }
      } catch (e) {}
    }
  };
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    // 兼容 CRLF（\r\n\r\n）与 LF（\n\n）两种 SSE 分隔
    buf += dec.decode(value, { stream: true }).replace(/\r\n/g, '\n');
    flush();
  }
  buf += dec.decode();
  flush();
  return reply;
}
async function sendAI() {
  const ta = $('#aiInput'); const text = ta.value.trim(); if (!text || aiBusy) return;
  ta.value = '';
  const c = getAICfg(); if (!c.endpoint) { ensureAI(); return; }
  aiMsgs.push({ role: 'user', content: text });
  paintAI();
  const msgs = $('#aiMsgs'); msgs.classList.remove('cfg-missing');
  const typing = document.createElement('div');
  typing.className = 'ai-typing'; typing.id = 'aiType';
  typing.innerHTML = '<i></i><i></i><i></i>';
  msgs.appendChild(typing);
  msgs.scrollTop = msgs.scrollHeight;
  aiBusy = true;
  let reply = '';
  let cur = null;
  const ensureCur = () => {
    if (!cur) { typing.outerHTML = '<div class="msg bot" id="aiCur"></div>'; cur = $('#aiCur'); }
    return cur;
  };
  try {
    // 速度优先：仅携带最近 6 条历史 + 限制输出长度；开启流式，逐字显示
    const history = aiMsgs.slice(0, -1).slice(-6);
    const body = {
      model: c.model,
      messages: [{ role: 'system', content: c.systemPrompt || '' }, ...history, { role: 'user', content: text }],
      temperature: c.temperature ?? 0.7,
      stream: true,
      max_tokens: c.maxTokens || 1200,
    };
    const onDelta = r => { ensureCur(); cur.innerHTML = mdToHtml(r); msgs.scrollTop = msgs.scrollHeight; };
    reply = await aiFetchOnce(c, body, onDelta);
    if (!reply.trim()) {
      // 空响应：大概率是网络/网关偶发，自动重试一次
      await new Promise(r => setTimeout(r, 600));
      reply = await aiFetchOnce(c, body, onDelta);
    }
    if (!reply.trim()) {
      reply = '⚠ 本次响应为空（已自动重试一次）。可再发一次试试，或检查 API 端点 / 模型 / 额度状态。';
    }
    aiMsgs.push({ role: 'assistant', content: reply });
  } catch (e) {
    aiMsgs.push({ role: 'assistant', content: '⚠ 请求失败：' + e.message });
  }
  aiBusy = false;
  paintAI();
}
const AI_STARTERS = ['帮我赏析：大漠孤烟直，长河落日圆', '用一句话概括“守拙归园田”的心境', '帮我润色一段自我介绍', '推荐三本国学入门书'];

    toast('总结失败：' + e.message);

function paintAI() {
  const el = $('#aiMsgs'); if (!el) return;
  el.classList.remove('cfg-missing');
  el.innerHTML = aiMsgs.map(m => `<div class="msg ${m.role === 'user' ? 'user' : 'bot'}">${m.role === 'user' ? esc(m.content) : mdToHtml(m.content)}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}
function inl(s) {
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|(?<=\s))\*([^*\n]+)\*(?=\s|$|\n)/g, '<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  return s;
}
function mdToHtml(src) {
  // 逐行号解析，行级标记(代码/标题/引用/列表)各自成块，段落只做行内渲染，
  // 杜绝“先转 HTML 再按空行切块”导致内容(尤其代码块内的空行)被过滤。
  const lines = String(src || '').replace(/\r\n/g, '\n').split('\n');
  const out = [];
  let buf = [];
  const flushP = () => {
    const s = buf.join('\n').trim();
    if (s) out.push('<p>' + inl(s.replace(/\n/g, '<br>')) + '</p>');
    buf = [];
  };
  const isB = ln => /^[-*]\s+/.test(ln);
  const isN = ln => /^\d+\.\s+/.test(ln);
  const isQ = ln => /^>\s?/.test(ln);
  let i = 0;
  while (i < lines.length) {
    const ln = lines[i];
    if (/^```/.test(ln)) {
      flushP();
      const code = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>');
      continue;
    }
    const hm = ln.match(/^#{1,6}\s+(.*)$/);
    if (hm) {
      flushP();
      const lvl = Math.min(4, hm[0].match(/^#+/)[0].length);
      out.push('<h' + (lvl + 1) + '>' + inl(esc(hm[1])) + '</h' + (lvl + 1) + '>');
      i++; continue;
    }
    if (isQ(ln)) {
      flushP();
      const q = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + q.map(x => inl(esc(x))).join('<br>') + '</blockquote>');
      continue;
    }
    if (isB(ln) || isN(ln)) {
      flushP();
      const tag = isB(ln) ? 'ul' : 'ol';
      const items = [];
      while (i < lines.length) {
        const t = isB(lines[i]) ? 'ul' : (isN(lines[i]) ? 'ol' : null);
        if (t !== tag) break;
        items.push(lines[i].replace(/^[-*]\s+/, '').replace(/^\d+\.\s+/, ''));
        i++;
      }
      out.push('<' + tag + '>' + items.map(x => '<li>' + inl(esc(x)) + '</li>').join('') + '</' + tag + '>');
      continue;
    }
    if (!ln.trim()) { flushP(); i++; continue; }
    buf.push(ln.trim());
    i++;
  }
  flushP();
  return out.join('\n');
}

function toggleFloatAI() {

/* 拖动 */
function push(id, left, top) {
  const st = $('#aiPanel').style; st.left = left + 'px'; st.top = top + 'px';
  st.width = id === 'default' ? '400px' : st.width;
}
function dragInit() {
  const head = $('#aiHead'), panel = $('#aiPanel');
  let sx = 0, sy = 0, ox = 0, oy = 0, dragging = false;
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return; // 标题栏上的按钮(关闭等)不触发拖动，保证可点击
    dragging = true; sx = e.clientX; sy = e.clientY;
    const r = panel.getBoundingClientRect(); ox = r.left; oy = r.top;
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove', e => { if (!dragging) return;
    panel.style.left = (ox + e.clientX - sx) + 'px'; panel.style.top = (oy + e.clientY - sy) + 'px'; });
  head.addEventListener('pointerup', e => { dragging = false; });
  head.addEventListener('pointercancel', e => { dragging = false; });
}

function exportAll() {
  const data = { tags: S.tags, sentences: S.sentences, notes: S.notes };
  const date = nowStr().replace(/-/g, '');
  let md = '# 文字积累整理\n\n'; const byTag = {};
  S.sentences.forEach(s => (s.tags || []).forEach(t => (byTag[t] = byTag[t] || []).push(s)));
  S.tags.forEach(t => { const it = byTag[t.name] || []; if (!it.length) return; md += '## ' + t.name + '\n\n';
    it.forEach(s => { md += '- ' + s.text + (s.author ? ' —— ' + s.author : '') + (s.source ? ' ' + s.source : '') + '\n'; }); md += '\n'; });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown' }));
  a.download = '文字积累成文_' + date + '.md'; a.click(); URL.revokeObjectURL(a.href);
}
