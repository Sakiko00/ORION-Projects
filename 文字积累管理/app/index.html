<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字积累 · 百尺方圆</title>
<style>
  /* ============================================================
     百尺方圆 · 新中式设计系统
     行于百尺竿头，进于方圆之间
     配色取自青瓷竹韵图 · 青碧为主，竹青为辅
     ============================================================ */
  :root {
    /* ---- 页面与表面 · 青白瓷色系 ---- */
    --page-bg: #e8f0ed;              /* 页面底色：青白 */
    --surface-card: #f5f8f6;         /* 卡片：素青白 */
    --surface-nested: #d8e8e4;       /* 嵌套区域：浅青瓷 */

    /* ---- 边框 · 青灰系 ---- */
    --border: #c0d0cc;               /* 常规边框：浅青灰 */
    --border-input: #a0b8b2;         /* 强边框：深青灰 */

    /* ---- 文本层级 · 墨青色系 ---- */
    --text: #1a2a26;                 /* 主文本：浓墨青 */
    --text-secondary: #4a5a56;       /* 次文本：苍青灰 */
    --text-tertiary: #8a9a96;        /* 弱文本：浅青灰 */

    /* ---- 主色 · 青碧 ---- */
    --accent: #5a9e8a;               /* 主色：青碧 */
    --accent-muted: #d8e8e0;         /* 主色浅底：淡青 */
    --on-accent: #f5f8f6;            /* 主色上的前景文字 */

    /* ---- 模块色 · 国色五色 ---- */
    --module-1: #4a9b6b;             /* 竹青 — 打卡/完成/收入 */
    --module-2: #5a8a9e;             /* 黛青 — 目标/focus/趋势线 */
    --module-3: #7ab8b0;             /* 青瓷 — 连续天数/星标 */
    --module-4: #8b7b5a;             /* 赭黄 — 记账/占比图 */
    --module-5: #8a7cae;             /* 雾紫 — 笔记/灵感 */

    /* ---- 危险色 ---- */
    --danger: #c97070;               /* 淡胭脂 — 删除/危险操作 */
    --danger-muted: #f0e0e0;         /* 危险浅底 */

    /* ---- 抽屉/侧栏 · 深墨青 ---- */
    --drawer-bg: #1a2a26;            /* 侧栏底色：深墨青 */
    --drawer-bg-top: #243530;        /* 侧栏渐变上色 */
    --drawer-text: #e0e8e4;          /* 侧栏前景文字：青白 */
    --drawer-text-mute: rgba(224,232,228,.45);   /* 侧栏次要文字 */
    --drawer-hover: rgba(90,158,138,.12);          /* 侧栏悬停底 */
    --drawer-active: rgba(90,158,138,.20);        /* 侧栏选中底 */

    /* ---- 暗色装饰卡渐变 · 青墨晕染 ---- */
    --dark-card-1: #1a2a26;
    --dark-card-2: #0f1a17;
    --dark-card-3: #243530;
    --dark-accent-glow: rgba(90,158,138,.30);
    --dark-accent-glow-2: rgba(74,155,107,.20);

    /* ---- 背景图 ---- */
    --greet-image: url("assets/greet-banner.jpg");
    --page-texture: none;

    /* ---- 圆角 · 方圆之间 ---- */
    --radius-control: 6px;
    --radius-tile: 10px;
    --radius-card: 14px;
    --radius-sheet: 18px;

    /* ---- 阴影 · 轻柔如墨 ---- */
    --shadow-card: 0 1px 3px rgba(26,42,38,.04), 0 3px 12px rgba(26,42,38,.05);
    --shadow-overlay: 0 8px 24px rgba(26,42,38,.12);

    /* ---- 字体 · 宋体标题 + 黑体正文 ---- */
    --font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --font-serif: "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", serif;
    --font-mono: "Cascadia Code", "Fira Code", "JetBrains Mono", "SF Mono", Consolas, monospace;
    --sidebar-w: 250px;
    /* ---- 动效 ---- */
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    --ease-snap: cubic-bezier(0.85, 0, 0.15, 1);
    --dur: 0.2s;
  }

  /* ---- 深色主题 · 夜青墨色 ---- */
  [data-theme="dark"] {
    --page-bg: #0f1a17;
    --surface-card: #1a2a26;
    --surface-nested: #243530;
    --border: #2d3d38;
    --border-input: #3a4d46;
    --text: #e0e8e4;
    --text-secondary: #8a9a96;
    --text-tertiary: #5a6a66;
    --accent: #7ab8b0;
    --accent-muted: rgba(122,184,176,.15);
    --on-accent: #0f1a17;
    --module-1: #5dbc7f;
    --module-2: #6a9ab0;
    --module-3: #8ac8c0;
    --module-4: #b09570;
    --module-5: #9a8cc0;
    --danger: #d08080;
    --danger-muted: rgba(208,128,128,.15);
    --drawer-bg: #050a08;
    --drawer-bg-top: #0a1410;
    --drawer-text: #e0e8e4;
    --drawer-text-mute: rgba(224,232,228,.45);
    --drawer-hover: rgba(122,184,176,.12);
    --drawer-active: rgba(122,184,176,.20);
    --dark-card-1: #243530;
    --dark-card-2: #1a2a26;
    --dark-card-3: #2d3d38;
    --dark-accent-glow: rgba(122,184,176,.35);
    --dark-accent-glow-2: rgba(93,188,127,.22);
    --shadow-card: 0 1px 3px rgba(0,0,0,.3), 0 3px 12px rgba(0,0,0,.18);
    --shadow-overlay: 0 8px 24px rgba(0,0,0,.38);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--page-bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility; font-feature-settings: "kern" 1, "liga" 1;
    min-height: 100vh; min-width: 1000px;
  }
  /* 统一全局滚动条 — 细润如竹 */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-input); border-radius: 6px; transition: background var(--dur) var(--ease); opacity:.6; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }
  * { scrollbar-width: thin; scrollbar-color: var(--border-input) transparent; }
  /* 焦点态 — 无障碍 */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline-offset: 1px; }
  /* 尊重用户动效偏好 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important; }
  }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image: var(--page-texture); background-size: cover; background-position: center; opacity:.5; }
  svg { display: block; }
  .layout { min-height: 100vh; }

  /* ---------- sidebar · 水墨长卷 ---------- */
  .sidebar { background: linear-gradient(180deg, var(--drawer-bg-top), var(--drawer-bg)); color: var(--drawer-text);
    display: flex; flex-direction: column; position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh; z-index: 30;
    border-right: 1px solid rgba(90,158,138,.15); }
  .sidebar::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.025;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 28px, var(--drawer-text) 28px, var(--drawer-text) 29px),
    repeating-linear-gradient(90deg, transparent, transparent 28px, var(--drawer-text) 28px, var(--drawer-text) 29px); }
  /* 侧栏背景图（降透明度若隐若现，保留底色保证可读性） */
  .sidebar::after { content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(0deg, var(--drawer-bg) 6%, color-mix(in srgb, var(--drawer-bg) 30%, transparent) 46%, transparent 92%),
      url("assets/侧边栏背景.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity:.32; }
  .sidebar > * { position:relative; z-index:1; }
  .sidebar .brand { padding: 24px 20px 18px; display: flex; align-items: center; gap: 13px; }
  .sidebar .brand .ava { position: relative; width: 44px; height: 44px; border-radius: 8px; overflow: hidden; flex: 0 0 auto;
    background: var(--drawer-hover); box-shadow: 0 0 0 1px var(--drawer-active); cursor: pointer; }
  .sidebar .brand .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sidebar .brand .ava .cam { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0;
    background: rgba(26,23,20,.5); color: var(--drawer-text); transition: opacity var(--dur) var(--ease); }
  .sidebar .brand .ava:hover .cam { opacity: 1; }
  .sidebar .brand h1 { font-size: 18px; font-weight: 800; letter-spacing: .02em; font-family: var(--font-serif); }
  .sidebar .brand p { font-size: 10.5px; opacity: .45; margin-top: 3px; letter-spacing: .08em; }
  .sidebar .nav { flex: 1; overflow-y: auto; padding: 6px 10px 12px; }
  .navi { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 500; color: color-mix(in srgb, var(--drawer-text) 80%, transparent); transition: background var(--dur) var(--ease), color var(--dur) var(--ease); margin-bottom: 2px;
    border-left: 2px solid transparent; }
  .navi:hover { background: var(--drawer-hover); color: var(--drawer-text); }
  .navi.active { background: var(--drawer-active); color: var(--drawer-text); font-weight: 700; border-left-color: var(--accent); }
  .navi svg { color: var(--drawer-text-mute); flex: 0 0 auto; }
  .navi.active svg { color: var(--drawer-text); }
  .nav-sep { font-size: 10px; opacity: .35; padding: 15px 14px 6px; letter-spacing: .15em; font-family: var(--font-serif); }
  .sidebar .foot { padding: 12px 16px 15px; border-top: 1px solid var(--drawer-hover); display:flex; flex-direction:column; gap:4px; }
  .sidebar .foot > span:last-child { font-size: 10.5px; opacity: .35; font-family: var(--font-serif); }
  .sidebar .brand { position: relative; }

  /* ---------- main ---------- */
  .main { margin-left: var(--sidebar-w); padding: 26px 34px 48px; }
  .main > #screen { max-width: 1180px; }
  .header { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 6px; }
  .header h2 { font-size: 26px; font-weight: 800; letter-spacing: .01em; font-family: var(--font-serif); }
  .header p { color: var(--text-secondary); font-size: 13px; margin-top: 5px; }
  .header .spacer { flex: 1; }
  .date-chip { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-secondary);
    background: var(--surface-card); border:1px solid var(--border); border-radius:999px; padding:7px 14px;
    box-shadow: var(--shadow-card); transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease); }
  .date-chip:hover { border-color: var(--border-input); transform: translateY(-1px); }
  .date-chip svg { color: var(--text-tertiary); }

  /* ---------- hero banner · 卷轴展开 ---------- */
  .hero-banner { position: relative; overflow: hidden; border-radius: var(--radius-sheet); border: 1px solid var(--border);
    box-shadow: var(--shadow-card); min-height: 200px; display: flex; flex-direction: column; justify-content: center;
    padding: 34px 40px; margin-bottom: 24px;
    background: var(--surface-nested) var(--greet-image) right center / cover no-repeat; }
  .hero-banner::before { content:""; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(100deg, var(--surface-card) 34%, color-mix(in srgb, var(--surface-card) 82%, transparent) 52%, transparent 76%); }
  .hero-banner > * { position: relative; z-index: 1; }
  .hero-banner .hi { font-size: 32px; font-weight: 800; letter-spacing: .02em; font-family: var(--font-serif); }
  .hero-banner .sub { color: var(--text-secondary); font-size: 14px; margin-top: 7px; max-width: 460px; }
  .hero-banner .hstats { display: flex; gap: 26px; margin-top: 22px; }
  .hero-banner .hstat { display: flex; flex-direction: column; gap: 2px; }
  .hero-banner .hstat .n { font-size: 22px; font-weight: 800; letter-spacing: -.01em; font-family: var(--font-serif); }
  .hero-banner .hstat .t { font-size: 12px; color: var(--text-secondary); }
  .hero-banner .hstat + .hstat { padding-left: 26px; border-left: 1px solid var(--border-input); }
  .hero-banner .htop { position: absolute; top: 22px; right: 26px; z-index: 2; display: flex; gap: 10px; align-items: center; }

  .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
  .sec-title { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:800; margin: 18px 2px 10px; letter-spacing: -.01em; font-family: var(--font-serif); }
  .sec-title::before { content:""; width: 3px; height: 14px; border-radius: 2px; background: var(--accent); /* 朱砂 */ }

  /* ---------- dashboard grid ---------- */
  .grid { display: grid; gap: 16px; }
  .g-4 { grid-template-columns: repeat(4, 1fr); }
  .g-3 { grid-template-columns: repeat(3, 1fr); }
  .g-2 { grid-template-columns: repeat(2, 1fr); }
  .g-main { grid-template-columns: 1.55fr 1fr; align-items: start; }

  /* 各模块概况卡片 */
  .modcard-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .modcard { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    padding: 15px 16px; cursor: pointer; transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease); }
  .modcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-overlay); border-color: var(--border-input); }
  .modcard .mc-head { display:flex; align-items:center; gap: 11px; }
  .modcard .mc-ic { width: 36px; height: 36px; border-radius: 10px; display:grid; place-items:center; flex:0 0 auto; }
  .modcard .mc-tt { flex:1; min-width:0; }
  .modcard .mc-name { font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; }
  .modcard .mc-desc { font-size: 11.5px; color: var(--text-secondary); margin-top: 1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .modcard .mc-arw { color: var(--text-tertiary); flex:0 0 auto; }
  .modcard .mc-body { display:flex; align-items:baseline; gap: 8px; margin-top: 11px; }
  .modcard .mc-main { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .modcard .mc-extra { font-size: 12px; color: var(--text-secondary); }

  /* quote banner */
  .quote { padding: 22px 26px; border-radius: var(--radius-card); position: relative; overflow: hidden;
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); }
  .quote::before { content:""; position:absolute; left:0; top:18px; bottom:18px; width:3px; border-radius:2px; background: var(--accent); /* 朱砂条 */ }
  .quote .tag { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--text-secondary);
    letter-spacing:.04em; margin-bottom:11px; }
  .quote .tag svg { color: var(--text-tertiary); }
  .quote .txt { font-size:20px; font-weight:700; color:var(--text); letter-spacing:-.01em; line-height:1.5; font-family: var(--font-serif); }

  /* overview rings */
  .rings { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:0; }
  .ring { display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 4px; cursor:pointer; min-width:0;
    border-radius: var(--radius-card); transition: background var(--dur) var(--ease); }
  .ring:hover { background: var(--surface-nested); }
  .ring .dial { position:relative; width:100%; max-width:128px; aspect-ratio:1; }
  .ring .dial svg.gauge { transform: rotate(-90deg); width:100%; height:100%; }
  .ring .dial .mid { position:absolute; inset:0; display:grid; place-items:center; }
  .ring .pct { font-size:18px; font-weight:800; letter-spacing:-.02em; }
  .ring .lbl { font-size:14.5px; font-weight:700; }
  .ring .sub { font-size:12px; color:var(--text-secondary); }

  /* quick add */
  .quick-grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:10px; }
  .qbtn { display:flex; align-items:center; gap:12px; padding:14px 15px; border:none; cursor:pointer; border-radius:var(--radius-tile);
    background:var(--surface-card); border:1px solid var(--border); box-shadow: var(--shadow-card); text-align:left; transition: all var(--dur) var(--ease); min-width:0;
    color: var(--text); }
  .qbtn:hover { border-color:var(--border-input); transform: translateY(-1px); box-shadow: var(--shadow-overlay); }
  .qbtn .e { position:relative; width:42px; height:42px; border-radius:12px; display:grid; place-items:center; flex:0 0 auto; }
  .qbtn .e .qplus { position:absolute; right:-3px; bottom:-3px; width:17px; height:17px; border-radius:50%;
    background: var(--accent); color:var(--on-accent); display:grid; place-items:center; border: 2px solid var(--surface-card); }
  .qbtn .l { font-size:13.5px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* trend panel */
  .panel { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding:18px; }
  .panel .ph { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:800; }
  .panel .ph svg { color: var(--text-tertiary); }
  .panel .ph .avg { margin-left:auto; font-size:12px; color:var(--text-secondary); font-weight:500; }
  .trend-svg { width:100%; height:auto; margin-top:14px; display:block; }
  .trend-x { display:flex; justify-content:space-between; font-size:11px; color:var(--text-secondary); margin-top:4px; padding:0 6px; }
  .trend-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; height: 168px;
    color: var(--text-tertiary); font-size: 13px; margin-top: 8px; }

  /* ---------- pinned tasks ---------- */
  .pin-list { display:grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .pin { display:flex; align-items:center; gap: 13px; padding: 15px 16px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card);
    transition: box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease), border-color var(--dur) var(--ease); }
  .pin:hover { box-shadow: var(--shadow-overlay); transform: translateY(-1px); border-color: var(--border-input); }
  .pin-ic { width: 38px; height: 38px; border-radius: 11px; display:grid; place-items:center; flex:0 0 auto;
    background: var(--surface-nested); border: 1px solid var(--border); }
  .pin-b { flex:1; min-width:0; cursor:pointer; }
  .pin-t { font-size: 14.5px; font-weight: 700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pin-t.done { text-decoration: line-through; color: var(--text-secondary); }
  .pin-m { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
  .pin-chk { flex:0 0 auto; width: 26px; height: 26px; border-radius: 8px; border: 1.6px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition: all var(--dur) var(--ease); }
  .pin-chk.on { background: var(--module-1); border-color: var(--module-1); }
  .pin-chk svg { opacity: 0; }
  .pin-chk.on svg { opacity: 1; }
  .pin-step { flex:0 0 auto; display:flex; gap: 7px; }
  .pin-step button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-input);
    background: var(--surface-nested); color: var(--text); font-size: 18px; line-height: 1; cursor:pointer;
    display:grid; place-items:center; transition: all var(--dur) var(--ease); }
  .pin-step button:hover { background: var(--accent-muted); border-color: var(--accent); }
  .pin-empty { grid-column: 1 / -1; padding: 26px 20px; text-align:center; color: var(--text-secondary); font-size: 13px; line-height: 1.7;
    background: var(--surface-card); border: 1px dashed var(--border-input); border-radius: var(--radius-tile); }
  .pin-empty .mini-star { display:inline-flex; vertical-align:-2px; color: var(--module-3); }

  /* ---------- toolbar in module view ---------- */
  .toolbar { display:flex; align-items:center; gap:10px; margin: 14px 0 12px; }
  .btn { background:var(--accent); color:var(--on-accent); border:none; border-radius:10px; padding:10px 18px; font-size:14px; cursor:pointer;
    font-weight:700; box-shadow: var(--shadow-card); transition: filter var(--dur) var(--ease), transform var(--dur) var(--ease); display:inline-flex; align-items:center; gap:7px; }
  .btn:hover { filter: brightness(1.1); } .btn:active { transform: translateY(1px); }
  .btn.ghost { background:var(--surface-card); color:var(--text-secondary); border:1px solid var(--border-input); box-shadow:none; font-weight:500; }
  .btn.ghost:hover { color:var(--text); border-color:var(--text-tertiary); }
  .btn.danger { background:var(--danger); }
  .spacer { flex:1; }
  input, textarea { font-family:var(--font); font-size:14px; border:1px solid var(--border-input); border-radius:10px;
    padding:9px 12px; background:var(--surface-card); color:var(--text); outline:none; transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); width:100%; }
  input:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-muted); }
  textarea { resize:vertical; min-height:80px; }
  .search-box { position:relative; width: 240px; }
  .search-box svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-tertiary); pointer-events:none; }
  .search-box input { padding-left:34px; }

  /* module hero header (per-type summary) */
  .hero { display:flex; align-items:center; gap: 13px; padding: 12px 16px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); margin-bottom: 4px; position:relative; overflow:hidden; }
  .hero.has-cover { padding: 0; min-height: 96px; }
  .hero.has-cover .hero-bg { position:absolute; inset:0; background-size:cover; background-position:center; }
  .hero.has-cover .hero-bg::after { content:""; position:absolute; inset:0; background: linear-gradient(90deg, var(--surface-card) 28%, color-mix(in srgb, var(--surface-card) 60%, transparent) 55%, transparent 80%); }
  .hero.has-cover > .hero-inner { position:relative; z-index:1; padding: 12px 16px; display:flex; align-items:center; gap:13px; }
  .hero-ic { width: 40px; height: 40px; border-radius: 11px; display:grid; place-items:center; flex:0 0 auto; }
  .hero-tx { min-width:0; flex:1; }
  .hero-row { display:flex; align-items:baseline; gap: 9px; flex-wrap:wrap; }
  .hero-v { font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .hero-l { font-size: 13px; color: var(--text-secondary); }

  /* record thumbnail + custom field meta tags */
  .rec .thumb { width:48px; height:48px; border-radius:var(--radius-tile); object-fit:cover; flex:0 0 auto; margin-right:2px; }
  .rec .meta-line { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:4px; flex:1 0 100%; }
  .rec .meta-tag { font-size:12px; font-weight:600; color:var(--text-secondary); }
  .rec .meta-tag::before { content:"·"; margin-right:6px; color:var(--text-tertiary); }
  .rec .meta-tag:first-child::before { display:none; }

  /* ---- layout variants (open-ended: add .rec-layout-xxx in <style> to extend) ---- */
  /* feature: 大图在上 + 标题 + 正文在下 */
  .rec.rec-layout-feature { padding:0; overflow:hidden; }
  .rec.rec-layout-feature .top { flex-direction:column; align-items:stretch; }
  .rec.rec-layout-feature .thumb { width:100%; height:160px; border-radius:0; margin:0; }
  .rec.rec-layout-feature .feat-title { padding:12px 16px 4px; font-size:15px; font-weight:700; color:var(--text); }
  .rec.rec-layout-feature .feat-body { padding:0 16px 14px; font-size:13px; color:var(--text-secondary); line-height:1.55; }
  /* quote: 大字居中 + 留白 */
  .rec.rec-layout-quote { padding:24px 20px; }
  .rec.rec-layout-quote .quote-text { font-size:18px; font-weight:600; line-height:1.6; color:var(--text); }
  .rec.rec-layout-quote .quote-meta { margin-top:10px; font-size:12px; color:var(--text-tertiary); }


  /* module two-column layout: 左记录 / 右统计侧栏 */
  .mod-layout { display:grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; margin-top: 14px; }
  .mod-side { display:flex; flex-direction:column; gap: 12px; position: sticky; top: 16px; }
  .side-card { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:14px 15px; }
  .side-card .sh { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; margin-bottom:10px; }
  .side-card .sh svg { color:var(--text-tertiary); }
  .stat-row { display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); }
  .stat-row:last-child { border-bottom:none; padding-bottom:0; }
  .stat-row .k { font-size:12.5px; color:var(--text-secondary); display:flex; align-items:center; gap:7px; }
  .stat-row .k .kd { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .stat-row .val { font-size:14px; font-weight:800; letter-spacing:-.01em; }
  /* 分类占比条 */
  .catbar { margin-top:4px; }
  .catbar .cbrow { display:flex; align-items:center; gap:9px; padding:7px 0; }
  .catbar .cbrow .cbn { font-size:12.5px; color:var(--text); width:52px; flex:0 0 auto; }
  .catbar .cbrow .cbt { flex:1; height:8px; border-radius:999px; background:var(--border); overflow:hidden; }
  .catbar .cbrow .cbt i { display:block; height:100%; border-radius:999px; }
  .catbar .cbrow .cbv { font-size:12px; color:var(--text-secondary); width:56px; text-align:right; flex:0 0 auto; }
  /* 大环形（进度/打卡侧栏） */
  .side-ring { display:flex; flex-direction:column; align-items:center; gap:8px; padding:6px 0 2px; }
  .side-ring .dial { position:relative; width:120px; height:120px; }
  .side-ring .dial svg.gauge { transform: rotate(-90deg); width:120px; height:120px; }
  .side-ring .dial .mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .side-ring .big { font-size:26px; font-weight:800; letter-spacing:-.02em; }
  .side-ring .cap { font-size:12px; color:var(--text-secondary); }

  /* finance summary minis */
  .mod-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom: 4px; }
  .mini { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:12px 14px; }
  .mini .l { font-size:12px; color:var(--text-secondary); }
  .mini .v { font-size:19px; font-weight:800; margin-top:3px; letter-spacing:-.02em; }

  /* record list — 行式列表 */
  .rec-grid { display:flex; flex-direction:column; gap:9px; }
  .rec { position:relative; background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:14px 16px; transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
  .rec:hover { border-color: var(--border-input); box-shadow: var(--shadow-overlay); }
  .rec .top { display:flex; align-items:center; gap:12px; }
  .rec .chk { flex:0 0 auto; width:23px; height:23px; border-radius:7px; border:1.6px solid var(--border-input); display:grid; place-items:center;
    cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition: all var(--dur) var(--ease); }
  .rec .chk.on { background:var(--module-1); border-color:var(--module-1); }
  .rec .chk svg { opacity:0; } .rec .chk.on svg { opacity:1; }
  .rec .body { flex:1; min-width:0; cursor:pointer; display:flex; align-items:center; gap:11px; flex-wrap:wrap; }
  .rec .rname { font-weight:700; font-size:14.5px; letter-spacing:-.01em; flex:0 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .rec .rname.done { text-decoration:line-through; color:var(--text-secondary); }
  .rec .rmeta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .rec .rnote { flex:1 0 100%; color:var(--text-secondary); font-size:12.5px; margin-top:5px; white-space:pre-wrap; line-height:1.5;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .badge { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .badge .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .rec .acts { position:absolute; top:50%; right:8px; transform:translateY(-50%); display:flex; gap:1px; opacity:0; transition: opacity var(--dur) var(--ease); background:var(--surface-card); }
  .rec:hover .acts { opacity:1; }
  .rec .acts button { border:none; background:transparent; color:var(--text-tertiary); cursor:pointer;
    width:28px; height:28px; border-radius:7px; display:grid; place-items:center; transition: all var(--dur) var(--ease); }
  .rec .pin-btn:hover { background:var(--surface-nested); color:var(--module-3); }
  .rec .pin-btn.on { color:var(--module-3); opacity:1; } .rec .pin-btn.on svg { fill: var(--module-3); }
  .rec:has(.pin-btn.on) .acts { opacity:1; }
  .rec .del:hover { background:var(--danger-muted); color:var(--danger); }
  .rec .pbar { flex:1; min-width:80px; height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .rec .pbar i { display:block; height:100%; border-radius:999px; }
  .rec .amt { font-size:15px; font-weight:800; letter-spacing:-.02em; white-space:nowrap; margin-left:auto; }
  .rec .amt.exp { color:var(--danger); } .rec .amt.inc { color:var(--module-1); }
  .rec .streak { font-size:11.5px; color:var(--module-3); font-weight:700; display:inline-flex; align-items:center; gap:4px; }
  .rec .rdate { color:var(--text-secondary); font-size:11.5px; margin-left:auto; white-space:nowrap; }
  .empty { text-align:center; color:var(--text-secondary); padding:50px 20px; }
  .empty .e { display:inline-grid; place-items:center; width:56px; height:56px; border-radius:16px; background:var(--surface-card); border:1px solid var(--border); color:var(--text-tertiary); margin-bottom:12px; }

  /* ---------- modal — Rams: 克制、聚焦 ---------- */
  .overlay { position:fixed; inset:0; background:color-mix(in srgb, var(--text) 44%, transparent); backdrop-filter: blur(4px); z-index:60;
    display:flex; align-items:center; justify-content:center; animation: fade .16s var(--ease); }
  @keyframes fade { from { opacity:0; } }
  .modal { background:var(--surface-card); border-radius:var(--radius-sheet); padding:28px; width:480px; max-width:92vw; max-height:90vh; overflow-y:auto;
    box-shadow:0 24px 60px color-mix(in srgb, var(--text) 26%, transparent), 0 0 0 1px var(--border);
    animation: pop .22s cubic-bezier(.2,.8,.3,1); }
  @keyframes pop { from { transform: translateY(12px) scale(.97); opacity:0; } }
  .modal h3 { font-size:18px; font-weight:800; letter-spacing:-.01em; font-family: var(--font-serif); }
  .modal .sub { color:var(--text-secondary); font-size:13px; margin:6px 0 20px; line-height:1.5; }
  .field { margin-bottom:16px; }
  .field:last-of-type { margin-bottom:0; }
  .field label { display:block; color:var(--text-secondary); font-size:12px; font-weight:700; margin-bottom:6px; letter-spacing:.01em; }
  .frow { display:flex; gap:12px; } .frow .field { flex:1; }
  .seg { display:flex; gap:8px; flex-wrap:wrap; }
  .seg .opt { flex:1; min-width:64px; text-align:center; padding:10px; border-radius:var(--radius-control); border:1px solid var(--border-input);
    cursor:pointer; font-size:13px; font-weight:600; color:var(--text-secondary); transition: all var(--dur) var(--ease); }
  .seg .opt:hover { border-color:var(--text-tertiary); color:var(--text); }
  .seg .opt.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .modal-actions { display:flex; align-items:center; gap:10px; margin-top:24px; padding-top:18px; border-top:1px solid var(--border); }
  .link-danger { color:var(--danger); background:none; border:none; font-size:14px; font-weight:600; cursor:pointer; padding:8px 10px; border-radius:8px; transition: background var(--dur) var(--ease); }
  .link-danger:hover { background:var(--danger-muted); }

  /* ---- 编辑器图片上传 ---- */
  .ed-img-row { display:flex; gap:10px; align-items:flex-start; }
  .ed-img-upload { flex:0 0 auto; width:88px; height:88px; border-radius:var(--radius-tile);
    border:1.5px dashed var(--border-input); display:grid; place-items:center; cursor:pointer;
    font-size:12px; color:var(--text-tertiary); transition:all var(--dur) var(--ease); position:relative;
    background:var(--surface-nested); overflow:hidden; }
  .ed-img-upload:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-muted); }
  .ed-img-upload .ed-img-preview { width:100%; height:100%; position:relative; }
  .ed-img-upload .ed-img-preview img { width:100%; height:100%; object-fit:cover; }
  .ed-img-upload .ed-img-remove { position:absolute; top:4px; right:4px; width:20px; height:20px;
    border-radius:50%; background:var(--danger); color:var(--on-accent); border:none; cursor:pointer;
    font-size:11px; display:grid; place-items:center; opacity:0; transition:opacity var(--dur) var(--ease); }
  .ed-img-upload:hover .ed-img-remove { opacity:1; }

  /* ============================================================
     BENTO DASHBOARD — 首页复杂网格布局（墨色中性 · 高密度）
     ============================================================ */
  .bento { display:grid; grid-template-columns: repeat(12, 1fr); gap:16px; align-items:stretch; }
  .bento > * { min-width:0; }   /* 允许网格轨道收窄，避免窄屏内容溢出 */
  .b3{grid-column:span 3} .b4{grid-column:span 4} .b5{grid-column:span 5}
  .b6{grid-column:span 6} .b7{grid-column:span 7} .b8{grid-column:span 8} .b12{grid-column:span 12}

  /* 分组标题（EN 副标题 + 中文标题 + 分隔线） */
  .sec-grp { display:flex; align-items:center; gap:12px; margin:26px 2px 14px; }
  .sec-grp .bar { width:4px; height:19px; border-radius:2px; background:var(--accent); flex:0 0 auto; }
  .sec-grp .zh { font-size:16px; font-weight:800; letter-spacing:-.02em; font-family: var(--font-serif); }
  .sec-grp .en { font-size:10.5px; font-weight:800; letter-spacing:.15em; color:var(--text-tertiary); }
  .sec-grp .line { flex:1; height:1px; background:var(--border); }

  /* 通用瓷砖 */
  .tile { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); box-shadow:var(--shadow-card);
    padding:18px 20px; display:flex; flex-direction:column; }
  .tile-h { display:flex; align-items:center; gap:9px; margin-bottom:14px; }
  .tile-h .tic { color:var(--text-tertiary); display:flex; }
  .tile-h .en { font-size:9.5px; font-weight:800; letter-spacing:.14em; color:var(--text-tertiary); line-height:1; }
  .tile-h .zh { font-size:14px; font-weight:800; letter-spacing:-.01em; line-height:1.15; font-family: var(--font-serif); }
  .tile-h .tt { display:flex; flex-direction:column; gap:3px; }
  .tile-h .r { margin-left:auto; font-size:12px; color:var(--text-secondary); font-weight:700; }

  /* 整体情况瓷砖 */
  .ov2-body { display:grid; grid-template-columns:1fr 300px; gap:22px; flex:1; align-items:stretch; }
  .ov2-body .rings { align-content:center; }
  .ov2-side { position:relative; overflow:hidden; border-radius:var(--radius-card);
    background:linear-gradient(150deg,var(--dark-card-3) 0%,var(--dark-card-1) 62%,var(--dark-card-2) 100%); box-shadow:var(--shadow-overlay);
    padding:20px; display:flex; flex-direction:column; justify-content:space-between; gap:12px; }
  .ov2-side::before { content:""; position:absolute; width:190px; height:190px; border-radius:50%; right:-70px; top:-80px;
    background:radial-gradient(circle,var(--dark-accent-glow),transparent 70%); pointer-events:none; }
  .ov2-side::after { content:""; position:absolute; width:150px; height:150px; border-radius:50%; left:-55px; bottom:-70px;
    background:radial-gradient(circle,var(--dark-accent-glow-2),transparent 70%); pointer-events:none; }
  .ov2-stat { position:relative; z-index:1; display:flex; align-items:center; gap:13px; cursor:pointer;
    padding:12px 4px; border-radius:var(--radius-tile); transition:background var(--dur) var(--ease); }
  .ov2-stat:hover { background:color-mix(in srgb, var(--drawer-text) 6%, transparent); }
  .ov2-stat + .ov2-stat { border-top:1px solid color-mix(in srgb, var(--drawer-text) 9%, transparent); }
  .ov2-stat .s-ic { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; flex:0 0 auto;
    background:color-mix(in srgb, var(--drawer-text) 8%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--drawer-text) 10%, transparent); }
  .ov2-stat .s-tx { min-width:0; }
  .ov2-stat .s-v { font-size:24px; font-weight:800; letter-spacing:-.03em; line-height:1.05; color:var(--drawer-text);
    font-variant-numeric:tabular-nums; }
  .ov2-stat .s-l { font-size:11.5px; color:var(--drawer-text-mute); margin-top:3px; }

  /* 大时钟卡（暗色·点缀光晕） */
  .clock-card { position:relative; overflow:hidden; border-radius:var(--radius-sheet);
    background:linear-gradient(140deg,var(--dark-card-3) 0%,var(--dark-card-1) 60%,var(--dark-card-2) 100%); color:var(--drawer-text);
    padding:26px 28px; box-shadow:var(--shadow-overlay); display:flex; flex-direction:column; justify-content:space-between; min-height:196px; }
  .clock-card::before { content:""; position:absolute; width:220px; height:220px; border-radius:50%; right:-70px; top:-90px;
    background:radial-gradient(circle,var(--dark-accent-glow),transparent 70%); }
  .clock-card::after { content:""; position:absolute; width:170px; height:170px; border-radius:50%; left:-60px; bottom:-80px;
    background:radial-gradient(circle,var(--dark-accent-glow-2),transparent 70%); }
  .clock-card > * { position:relative; z-index:1; }
  .clock-card .hi { font-size:24px; font-weight:800; letter-spacing:-.02em; font-family: var(--font-serif); }
  .clock-card .sub { font-size:12.5px; opacity:.62; margin-top:5px; max-width:230px; line-height:1.5; }
  .clock-card .clk { font-size:clamp(38px,4.4vw,50px); font-weight:800; letter-spacing:.01em; font-variant-numeric:tabular-nums; line-height:1; }
  .clock-card .cmeta { display:flex; align-items:center; gap:10px; margin-top:9px; font-size:12px; opacity:.6; }
  .clock-card .cmeta .dot { width:4px; height:4px; border-radius:50%; background:currentColor; }

  /* 焦点/统计瓷砖 */
  .focus-list { display:flex; flex-direction:column; gap:9px; }
  .focus-row { display:flex; align-items:center; gap:11px; }
  .focus-row .fic { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:0 0 auto;
    background:var(--surface-nested); border:1px solid var(--border); }
  .focus-row .ft { flex:1; min-width:0; cursor:pointer; }
  .focus-row .fn { font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .focus-row .fn.done { text-decoration:line-through; color:var(--text-secondary); }
  .focus-row .fm { font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .focus-empty { color:var(--text-secondary); font-size:12.5px; line-height:1.7; padding:6px 0; }
  .stat-big { font-size:32px; font-weight:800; letter-spacing:-.03em; line-height:1; }
  .stat-big small { font-size:15px; color:var(--text-secondary); font-weight:700; letter-spacing:0; }
  .stat-cap { font-size:12px; color:var(--text-secondary); margin-top:7px; }
  .prog-line { height:7px; border-radius:999px; background:var(--border); overflow:hidden; margin-top:auto; }
  .prog-line i { display:block; height:100%; border-radius:999px; }

  /* 习惯追踪周网格表 */
  .habit-tb { width:100%; border-collapse:collapse; }
  .habit-tb th { font-size:10.5px; font-weight:700; color:var(--text-tertiary); padding:0 0 9px; text-align:center; }
  .habit-tb th.hh { text-align:left; }
  .habit-tb th.hr { text-align:right; }
  .habit-tb td { padding:5px 0; text-align:center; vertical-align:middle; }
  .habit-tb td.hn { text-align:left; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:118px; }
  .habit-tb td.hn .hdot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; vertical-align:middle; }
  .habit-tb td.hrate { text-align:right; font-size:12.5px; font-weight:800; letter-spacing:-.02em; }
  .hcell { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:7px; color:var(--on-accent); cursor:pointer; transition:transform var(--dur) var(--ease); }
  .hcell:hover { transform:scale(1.12); }
  .hcell.on { background:var(--module-1); }
  .hcell.off { background:var(--surface-nested); border:1px solid var(--border); }
  .hcell svg { opacity:0; } .hcell.on svg { opacity:1; }
  .habit-tb .tdcol { background:var(--accent-muted); }
  .habit-tb col.todaycol { background:var(--accent-muted); }

  /* 待办清单（仪表盘式） */
  .tk-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .tk-head .pct { font-size:22px; font-weight:800; letter-spacing:-.03em; }
  .tk-head .cnt { font-size:12px; color:var(--text-secondary); font-weight:700; }
  .tk-head .bar { flex:1; height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .tk-head .bar i { display:block; height:100%; border-radius:999px; background:var(--accent); }
  .tk-list { display:flex; flex-direction:column; }
  .tk-row { display:flex; align-items:center; gap:11px; padding:8px 0; border-bottom:1px solid var(--border); }
  .tk-row:last-child { border-bottom:none; }
  .tk-chk { flex:0 0 auto; width:20px; height:20px; border-radius:6px; border:1.6px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition:all var(--dur) var(--ease); }
  .tk-chk.on { background:var(--module-1); border-color:var(--module-1); }
  .tk-chk svg { opacity:0; } .tk-chk.on svg { opacity:1; }
  .tk-name { flex:1; min-width:0; font-size:13.5px; font-weight:600; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tk-name.done { text-decoration:line-through; color:var(--text-secondary); }

  /* 番茄钟（暗色炫酷卡） */
  .pomo { position:relative; overflow:hidden; border-radius:var(--radius-card); text-align:center;
    background:linear-gradient(155deg,var(--dark-card-3),var(--dark-card-2)); color:var(--drawer-text); padding:22px 20px; box-shadow:var(--shadow-overlay);
    display:flex; flex-direction:column; }
  .pomo::before { content:""; position:absolute; width:180px; height:180px; border-radius:50%; left:50%; top:-60px; transform:translateX(-50%);
    background:radial-gradient(circle,var(--dark-accent-glow),transparent 70%); }
  .pomo > * { position:relative; z-index:1; }
  .pomo .pen { font-size:9.5px; font-weight:800; letter-spacing:.16em; opacity:.55; }
  .pomo .pzh { font-size:13px; font-weight:800; margin-top:3px; font-family: var(--font-serif); }
  .pomo .ring-wrap { position:relative; width:150px; height:150px; margin:14px auto 12px; }
  .pomo .ring-wrap svg { transform:rotate(-90deg); }
  .pomo .ptime { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  .pomo .ptime .t { font-size:32px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.01em; }
  .pomo .ptime .s { font-size:11px; opacity:.6; }
  .pomo .pctl { display:flex; gap:8px; justify-content:center; margin-bottom:14px; }
  .pomo .pctl button { border:1px solid color-mix(in srgb, var(--drawer-text) 22%, transparent); background:color-mix(in srgb, var(--drawer-text) 8%, transparent); color:var(--drawer-text);
    border-radius:9px; padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer; transition:all var(--dur) var(--ease); }
  .pomo .pctl button:hover { background:color-mix(in srgb, var(--drawer-text) 16%, transparent); }
  .pomo .pctl button.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .pomo .pstats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .pomo .pstats .ps { background:color-mix(in srgb, var(--drawer-text) 6%, transparent); border-radius:10px; padding:9px 4px; }
  .pomo .pstats .pv { font-size:18px; font-weight:800; letter-spacing:-.02em; }
  .pomo .pstats .pl { font-size:10.5px; opacity:.55; margin-top:2px; }

  /* 在读好书 */
  .book-list { display:flex; flex-direction:column; gap:12px; }
  .book-row { display:flex; align-items:center; gap:12px; cursor:pointer; }
  .book-row .spine { width:34px; height:46px; border-radius:5px; flex:0 0 auto; position:relative; box-shadow:var(--shadow-card);
    display:grid; place-items:center; color:var(--on-accent); }
  .book-row .spine::after { content:""; position:absolute; left:4px; top:4px; bottom:4px; width:2px; border-radius:2px; background:rgba(255,255,255,.35); }
  .book-row .bmid { flex:1; min-width:0; }
  .book-row .btt { font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .book-row .bsub { font-size:11px; color:var(--text-secondary); margin-top:3px; }
  .book-row .bbar { height:5px; border-radius:999px; background:var(--border); overflow:hidden; margin-top:7px; }
  .book-row .bbar i { display:block; height:100%; border-radius:999px; }
  .book-row .bpct { font-size:14px; font-weight:800; letter-spacing:-.02em; flex:0 0 auto; }

  /* 本周目标 / 通用目标条 */
  .goal-list { display:flex; flex-direction:column; gap:13px; }
  .goal-row .gt { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; margin-bottom:7px; }
  .goal-row .gt .gp { margin-left:auto; font-size:12.5px; font-weight:800; color:var(--text-secondary); letter-spacing:-.02em; }
  .goal-row .gt .gdone { color:var(--module-1); display:flex; }
  .goal-row .gbar { height:7px; border-radius:999px; background:var(--border); overflow:hidden; }
  .goal-row .gbar i { display:block; height:100%; border-radius:999px; }

  /* 月度开销 */
  .spend-sum { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .spend-total { font-size:26px; font-weight:800; letter-spacing:-.03em; }
  .spend-cap { font-size:11.5px; color:var(--text-secondary); }

  .hidden { display:none !important; }

  /* 移动端侧栏切换按钮 — 默认隐藏 */
  .sidebar-toggle { display:none; position:fixed; top:14px; left:14px; z-index:40; width:42px; height:42px;
    border-radius:11px; border:1px solid var(--border); background:var(--surface-card); color:var(--text);
    cursor:pointer; align-items:center; justify-content:center; box-shadow:var(--shadow-card);
    transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease); }
  .sidebar-toggle:hover { border-color:var(--accent); color:var(--accent); transform:scale(1.05); }
  /* 移动端遮罩 — 默认隐藏 */
  .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:35;
    opacity:0; transition:opacity var(--dur) var(--ease); }
  .sidebar-overlay.show { display:block; opacity:1; }

  /* ============================================================
     响应式断点系统 — 内容驱动，三段式递减
     ============================================================ */

  /* ---- 断点 1: ≤1100px（平板横屏 / 小桌面）---- */
  @media (max-width: 1100px) {
    :root { --sidebar-w: 230px; }
    .main { padding: 24px 26px 40px; }
    .main > #screen { max-width: 100%; }
    /* bento: b3/b4 → 6列，b5/b6/b7/b8 → 12列 */
    .bento { grid-template-columns: repeat(6, 1fr); }
    .b3, .b4 { grid-column: span 6; }
    .b5, .b6, .b7, .b8, .b12 { grid-column: span 6; }
    /* 模块两栏 → 单栏 */
    .mod-layout { grid-template-columns: 1fr; }
    .mod-side { position: static; flex-direction: row; flex-wrap: wrap; }
    .mod-side .side-card { flex: 1 1 200px; }
    /* 概览双栏 → 单栏 */
    .ov2-body { grid-template-columns: 1fr; }
    /* provider/tool 网格 → 2列 */
    .settings-wrap .provider-grid,
    .tool-grid { grid-template-columns: repeat(2, 1fr); }
    /* nanobot config → 2列 */
    .nb-config-grid { grid-template-columns: repeat(2, 1fr); }
    .conn-modes { grid-template-columns: 1fr; }
    /* 财务摘要 → 2列 */
    .mod-summary { grid-template-columns: repeat(2, 1fr); }
    /* 设置页双栏 → 单栏 */
    .settings-cols { grid-template-columns: 1fr; gap: 0; }
  }

  /* ---- 断点 2: ≤768px（平板竖屏 / 大手机）---- */
  @media (max-width: 768px) {
    :root { --sidebar-w: 260px; }
    /* 侧栏变抽屉 */
    .sidebar { transform: translateX(-100%); transition: transform var(--dur) var(--ease); }
    .sidebar.open { transform: translateX(0); }
    .sidebar-toggle { display: flex; }
    /* main 去掉左 margin，顶部留出按钮空间 */
    .main { margin-left: 0; padding: 60px 16px 32px; }
    /* header 堆叠 */
    .header { flex-wrap: wrap; gap: 10px; }
    .header h2 { font-size: 22px; }
    .header .spacer { display: none; }
    .date-chip { font-size: 11.5px; padding: 6px 12px; }
    /* hero 缩小 */
    .hero-banner { min-height: 160px; padding: 18px 20px; }
    /* bento: 全部单列 */
    .bento { grid-template-columns: 1fr; }
    .b3, .b4, .b5, .b6, .b7, .b8, .b12 { grid-column: span 1; }
    /* 大时钟缩小 */
    .clock-card .clk-time { font-size: 36px !important; }
    /* 设置页 */
    .settings-wrap { max-width: 100%; }
    .settings-wrap .set-row { flex-direction: column; gap: 0; }
    .settings-wrap .provider-grid,
    .tool-grid,
    .nb-config-grid,
    .conn-modes { grid-template-columns: 1fr; }
    .set-avatar-row { flex-direction: column; align-items: stretch; gap: 12px; }
    .set-avatar-preview { align-self: center; }
    .set-avatar-emoji { justify-content: center; }
    /* 聊天 */
    .chat-wrap { height: calc(100vh - 160px); min-height: 400px; }
    .chat-top { padding: 10px 12px; flex-wrap: wrap; }
    .chat-body { padding: 14px 10px; }
    .chat-msg { max-width: 90%; }
    .chat-input-wrap { padding: 10px 12px; gap: 8px; }
    .chat-input-wrap textarea { min-height: 40px; font-size: 13px; }
    .chat-input-wrap .send-btn, .chat-input-wrap .img-btn { width: 40px; height: 40px; flex: 0 0 auto; }
    .chat-empty .ce-hints { max-width: 100%; }
    /* 模块列表 */
    .mod-summary { grid-template-columns: repeat(2, 1fr); }
    .toolbar { flex-wrap: wrap; gap: 8px; }
    .toolbar .search-box { width: 100%; }
    .toolbar .search-box input { width: 100%; }
    /* 习惯表格滚动 */
    .habit-tb-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .habit-tb { min-width: 500px; }
    /* modal */
    .modal { width: 100%; max-width: 100vw; border-radius: var(--radius-card) var(--radius-card) 0 0;
      padding: 20px 18px; max-height: 85vh; }
    .overlay { align-items: flex-end; }
    .frow { flex-direction: column; gap: 0; }
    /* 卡片间距收紧 */
    .tile { padding: 14px 16px; }
    .sec-grp { margin: 18px 2px 10px; }
  }

  /* ---- 断点 3: ≤480px（手机）---- */
  @media (max-width: 480px) {
    .main { padding: 56px 12px 24px; }
    .header h2 { font-size: 19px; }
    .header p { font-size: 11.5px; }
    .date-chip { display: none; }
    /* hero 进一步缩小 */
    .hero-banner { min-height: 130px; border-radius: var(--radius-card); }
    /* 财务摘要单列 */
    .mod-summary { grid-template-columns: 1fr; }
    /* 聊天更紧凑 */
    .chat-wrap { height: calc(100vh - 140px); border-radius: var(--radius-card); }
    .chat-msg { max-width: 94%; }
    .chat-msg .cm-bubble { font-size: 13px; padding: 10px 12px; }
    .chat-input-wrap { padding: 8px 10px; }
    .chat-input-wrap textarea { min-height: 36px; }
    /* 卡片内边距进一步收紧 */
    .tile { padding: 12px 14px; }
    .modal { padding: 18px 14px; }
    /* 设置页 */
    .settings-wrap .set-group { margin-bottom: 18px; padding-bottom: 16px; }
    .set-tab { padding: 10px 14px; font-size: 12.5px; }
    /* 侧栏品牌区紧凑 */
    .sidebar .brand { padding: 18px 16px 14px; }
    .sidebar .brand h1 { font-size: 15px; }
    /* 工具栏按钮 */
    .btn { padding: 8px 14px; font-size: 13px; }
    /* rec 卡片 */
    .rec { padding: 12px 12px; }
    .rec .body { gap: 8px; }
    .rec .rname { font-size: 13.5px; }
  }

  /* ---- 触摸设备优化 ---- */
  @media (hover: none) and (pointer: coarse) {
    .rec .acts { opacity: 1; }  /* 触摸设备常显操作按钮 */
    .navi:hover { background: transparent; }
    .navi:active { background: var(--drawer-hover); }
  }

  /* ---- 超宽屏优化 ---- */
  @media (min-width: 1600px) {
    .main > #screen { max-width: 1320px; }
    :root { --sidebar-w: 280px; }
  }

  /* ---------- 主题切换按钮 ---------- */
  .theme-toggle { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:11px; cursor:pointer;
    font-size:13px; font-weight:600; color:var(--drawer-text-mute); transition:all var(--dur) var(--ease); margin-bottom:8px; }
  .theme-toggle:hover { background:var(--drawer-hover); color:var(--drawer-text); }
  .theme-toggle svg { flex:0 0 auto; }
  .theme-toggle .tt-label { flex:1; }
  .theme-toggle .tt-track { position:relative; width:36px; height:20px; border-radius:999px; background:var(--drawer-hover);
    border:1px solid var(--drawer-active); transition:background var(--dur) var(--ease); flex:0 0 auto; }
  .theme-toggle .tt-knob { position:absolute; top:1px; left:1px; width:16px; height:16px; border-radius:50%;
    background:var(--drawer-text-mute); transition:transform var(--dur) var(--ease-snap), background var(--dur) var(--ease); }
  [data-theme="dark"] .theme-toggle .tt-track { background:var(--accent); border-color:var(--accent); }
  [data-theme="dark"] .theme-toggle .tt-knob { transform:translateX(16px); background:var(--on-accent); }

  /* ============================================================
     AI 聊天界面（nanobot 驱动） — Rams: 诚实、克制、细节完美
     ============================================================ */
  .chat-wrap { display:flex; flex-direction:column; height:calc(100vh - 200px); min-height:500px;
    background:var(--surface-card); border:1px solid var(--border); border-radius:0 0 var(--radius-card) var(--radius-card); box-shadow:var(--shadow-card); overflow:hidden; }
  .chat-top { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border);
    background:var(--surface-card); flex-shrink:0; }
  .chat-top .ct-dot { width:8px; height:8px; border-radius:50%; flex:0 0 auto; transition: box-shadow var(--dur) var(--ease); }
  .chat-top .ct-dot.on { background:var(--module-1); box-shadow:0 0 8px var(--module-1); animation: pulse 2s infinite; }
  .chat-top .ct-dot.off { background:var(--danger); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
  .chat-top .ct-name { font-size:14px; font-weight:800; letter-spacing:-.01em; font-family: var(--font-serif); }
  .chat-top .ct-mode { font-size:10px; font-weight:800; margin-left:6px; padding:2px 8px; border-radius:99px; letter-spacing:.06em; }
  .chat-top .ct-mode.agent { color:var(--module-1); background:var(--accent-muted); border:1px solid color-mix(in srgb, var(--module-1) 40%, transparent); }
  .chat-top .ct-mode.direct { color:var(--text-secondary); background:var(--surface-nested); border:1px solid var(--border-input); }
  .chat-top .ct-status { font-size:11px; color:var(--text-secondary); margin-left:4px; }
  .chat-top .date-chip { margin-left:auto; }
  .chat-body { flex:1; overflow-y:auto; padding:20px 18px; display:flex; flex-direction:column; gap:14px; }
  .chat-msg { display:flex; gap:10px; max-width:82%; animation:msgIn var(--dur) var(--ease); }
  .chat-msg > div:last-child { min-width:0; max-width:100%; }
  @keyframes msgIn { from{opacity:0;transform:translateY(8px);} }
  .chat-msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .chat-msg .cm-ava { width:32px; height:32px; border-radius:10px; display:grid; place-items:center; flex:0 0 auto;
    font-size:15px; overflow:hidden; transition: transform var(--dur) var(--ease); }
  .chat-msg .cm-ava:hover { transform: scale(1.06); }
  .chat-msg .cm-ava img { width:100%; height:100%; object-fit:cover; display:block; }
  .chat-msg.user .cm-ava { background:var(--accent); color:var(--on-accent); }
  .chat-msg.agent .cm-ava { background:var(--module-1); color:var(--on-accent); }
  .chat-msg .cm-bubble { padding:12px 16px; border-radius:var(--radius-tile); font-size:13.5px; line-height:1.65;
    overflow-wrap:anywhere; word-break:break-word; max-height:400px; overflow-y:auto; }
  /* 回复自动分段：段落间留白，列表/代码块间距规整 */
  .chat-msg .cm-bubble p { margin: 0 0 .55em; }
  .chat-msg .cm-bubble p:last-child { margin-bottom: 0; }
  .chat-msg .cm-bubble ul, .chat-msg .cm-bubble ol { margin: .3em 0 .55em; padding-left: 1.4em; }
  .chat-msg .cm-bubble li + li { margin-top: .2em; }
  .chat-msg .cm-bubble pre, .chat-msg .cm-bubble blockquote { margin: .4em 0 .55em; }
  .chat-msg .cm-bubble h1, .chat-msg .cm-bubble h2, .chat-msg .cm-bubble h3 { margin: .5em 0 .3em; }
  /* HTML 卡片渲染 */
  .chat-msg .cm-bubble .kb-card-slot { margin: 4px 0 8px; }
  .chat-msg .cm-bubble .kb-card { border:1px solid var(--border); border-radius:var(--radius-tile);
    background:var(--surface-card); padding:14px 16px; box-shadow:var(--shadow-card); }
  .chat-msg .cm-bubble .kb-card h3 { margin:0 0 8px; font-size:14px; }
  .chat-msg .cm-bubble .kb-card h4 { margin:8px 0 4px; font-size:12.5px; }
  .chat-msg .cm-bubble .kb-card table { width:100%; border-collapse:collapse; margin:6px 0; }
  .chat-msg .cm-bubble .kb-card th, .chat-msg .cm-bubble .kb-card td { border:1px solid var(--border-input); padding:6px 8px; text-align:left; font-size:12.5px; }
  .chat-msg .cm-bubble .kb-card th { background:var(--surface-nested); font-weight:700; }
  .chat-msg .cm-bubble .kb-card ul, .chat-msg .cm-bubble .kb-card ol { padding-left:1.4em; margin:.3em 0; }
  .chat-msg .cm-bubble .kb-card a { color:var(--accent); text-decoration:none; }
  .chat-msg .cm-bubble .kb-card img { max-width:100%; border-radius:8px; }
  .chat-msg .cm-bubble .card-iframe { display:block; width:100%; border:none; border-radius:14px;
    overflow:hidden; transition: height .2s ease; }
  .chat-msg.user .cm-bubble { background:var(--accent); color:var(--on-accent); border-bottom-right-radius:4px; }
  .chat-msg.agent .cm-bubble { background:var(--surface-nested); color:var(--text); border:1px solid var(--border);
    border-bottom-left-radius:4px; }
  .chat-msg .cm-time { font-size:10.5px; color:var(--text-tertiary); margin-top:4px; padding:0 4px; }
  .chat-msg.user .cm-time { text-align:right; }
  /* 分段加载：加载更早消息 */
  .chat-load-more { display:flex; justify-content:center; padding:4px 0 2px; }
  .chat-load-more .clm-btn { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary);
    background:var(--surface-nested); border:1px solid var(--border); border-radius:999px; padding:6px 14px;
    cursor:pointer; user-select:none; transition: all var(--dur) var(--ease); }
  .chat-load-more .clm-btn:hover { color:var(--accent); border-color:var(--accent); }
  .chat-load-more .clm-btn:active { transform:scale(.97); }
  .chat-load-more .clm-spin { animation: chatSpin .8s linear infinite; display:inline-block; }
  @keyframes chatSpin { to { transform:rotate(360deg); } }
  /* 连接错误提示条（chatSend 失败时显示在回复中） */
  .chat-err { display:flex; align-items:flex-start; gap:8px; margin:8px 0; padding:10px 14px;
    border-radius:var(--radius-tile); font-size:12.5px; line-height:1.6;
    background:var(--danger-muted); border:1px solid color-mix(in srgb, var(--danger) 30%, transparent); color:var(--danger);
    overflow-wrap:anywhere; word-break:break-word; }
  .chat-err svg { flex:0 0 auto; margin-top:2px; }
  /* 助手消息中的 Markdown 渲染 */
  .cm-bubble h1,.cm-bubble h2,.cm-bubble h3 { margin:10px 0 6px; font-weight:800; line-height:1.3; }
  .cm-bubble h2 { font-size:16px; }
  .cm-bubble h3 { font-size:14px; }
  .cm-bubble p { margin:4px 0; }
  .cm-bubble ul,.cm-bubble ol { margin:6px 0; padding-left:20px; }
  .cm-bubble li { margin:2px 0; }
  .cm-bubble code { font-family:var(--font-mono); font-size:12.5px;
    background:var(--border); padding:2px 6px; border-radius:4px; }
  .cm-bubble pre { background:var(--drawer-bg); color:var(--drawer-text); border-radius:var(--radius-tile);
    padding:14px 16px; overflow-x:auto; margin:8px 0; font-size:12.5px; line-height:1.5; }
  .cm-bubble pre code { background:none; padding:0; }
  .cm-bubble table { border-collapse:collapse; width:100%; margin:8px 0; font-size:12.5px; }
  .cm-bubble th,.cm-bubble td { border:1px solid var(--border); padding:6px 10px; text-align:left; }
  .cm-bubble th { background:var(--surface-nested); font-weight:700; }
  .cm-bubble blockquote { border-left:3px solid var(--accent); margin:8px 0; padding:4px 14px;
    color:var(--text-secondary); }
  .chat-msg.agent .cm-bubble strong { color:var(--accent); }
  .chat-msg.user .cm-bubble strong { color:inherit; font-weight:800; }
  .cm-bubble hr { border:none; border-top:1px solid var(--border); margin:10px 0; }
  /* loading — 更柔和的呼吸动效 */
  .chat-typing { display:flex; gap:10px; align-items:center; padding:12px 16px;
    background:var(--surface-nested); border-radius:var(--radius-tile); max-width:fit-content;
    border:1px solid var(--border); animation:msgIn var(--dur) var(--ease); }
  .chat-typing .dots { display:flex; gap:5px; }
  .chat-typing .dots span { width:7px; height:7px; border-radius:50%; background:var(--text-tertiary);
    animation:dotBounce 1.4s infinite var(--ease); }
  .chat-typing .dots span:nth-child(2) { animation-delay:.18s; }
  .chat-typing .dots span:nth-child(3) { animation-delay:.36s; }

  /* ============================================================

  .mcp-row:hover { border-color:var(--border-input); }
  .mcp-ic { color:var(--text-secondary); flex:0 0 auto; display:grid; place-items:center; }
  .mcp-body { flex:1; min-width:0; }
  .mcp-name { font-size:12.5px; font-weight:700; }

  .mcp-del { border:none; background:transparent; color:var(--text-tertiary); cursor:pointer; padding:6px; border-radius:6px; display:grid; place-items:center; transition:color var(--dur) var(--ease), background var(--dur) var(--ease); }
  .mcp-del:hover { color:var(--danger); background:var(--danger-muted); }
  .mcp-empty { padding:16px; text-align:center; font-size:12px; color:var(--text-tertiary); border:1px dashed var(--border-input); border-radius:var(--radius-tile); margin-bottom:12px; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  /* nanobot 启停控制 */
  .nano-ctrl { margin-top:14px; padding:12px 14px; border-radius:var(--radius-tile); border:1px solid var(--border-input); background:var(--surface-nested); }
  .nano-ctrl-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .nano-ic { color:var(--text-secondary); display:grid; place-items:center; }
  .nano-state { display:inline-flex; align-items:center; gap:6px; margin-left:2px; }
  .nano-state em { font-style:normal; font-size:12px; font-weight:700; }
  .nano-state .nano-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .nano-state.on .nano-dot { background:var(--module-1); box-shadow:0 0 8px var(--module-1); animation:pulse 2s infinite; }
  .nano-state.on em { color:var(--module-1); }
  .nano-state.off .nano-dot { background:var(--text-tertiary); }
  .nano-state.off em { color:var(--text-secondary); }
  .nano-state.missing .nano-dot { background:var(--module-2); }
  .nano-state.missing em { color:var(--module-2); }
  .nano-state.err .nano-dot { background:var(--danger); }
  .nano-state.err em { color:var(--danger); }
  .nano-state.busy .nano-dot { background:var(--text-tertiary); animation:pulse 1s infinite; }
  .nano-state.busy em { color:var(--text-secondary); }
  .nano-msg { font-size:11.5px; line-height:1.6; color:var(--text-secondary); margin-top:8px; }
  .nano-msg.err { color:var(--danger); }
  .nano-ctrl .btn-sm { padding:5px 12px; font-size:12px; }
  .nano-ctrl .btn-sm:disabled { opacity:.45; cursor:not-allowed; }
  .nano-ctrl .btn-sm#btn-nano-start:not(:disabled):hover { border-color:var(--module-1); color:var(--module-1); }
  .nano-ctrl .btn-sm#btn-nano-stop:not(:disabled):hover { border-color:var(--danger); color:var(--danger); }
/* ---- 基础：统一按钮字体 / 页面分区 / 模态框显隐 ---- */
  button { font-family: inherit; }
  .page { display:none; }
  .page.active { display:block; }
  .overlay { display:none; }
  .overlay.on { display:flex; align-items:center; justify-content:center; }

  /* ---- 侧栏导航（button 还原） ---- */
  .navi { width:100%; text-align:left; background:transparent; border:none; }

  /* ---- 品牌区：放大百尺方圆 logo，居中 ---- */
  .brand { display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:26px 16px 20px; text-align:center; }
  .brand-logo { width:86px; height:86px; border-radius:20px; overflow:hidden; flex:0 0 auto;
    background:var(--drawer-hover); box-shadow:0 0 0 1px var(--drawer-active), 0 10px 26px rgba(0,0,0,.25); }

  /* ---- 首页图表 ---- */
  .panel { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); padding:20px; }

  /* 每日一句 */
  .daily { position:relative; overflow:hidden; border-radius:var(--radius-sheet);
    background:linear-gradient(120deg, color-mix(in srgb, var(--accent) 14%, var(--surface-card)), var(--surface-card));
    border:1px solid var(--border); padding:30px 34px; text-align:center; }
  .daily .q-tag { font-size:11px; letter-spacing:.3em; color:var(--accent); font-family:var(--font-serif); }
  .daily .q-text { font-size:22px; line-height:1.85; font-family:var(--font-serif); color:var(--text); margin-top:10px; }
  .daily .q-src { font-size:13px; color:var(--text-tertiary); margin-top:14px; }

  /* 统计卡 */
  .stat-card { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);

  .stat-card::after { content:""; position:absolute; right:-20px; top:-20px; width:70px; height:70px; border-radius:50%;
    background:var(--c, var(--accent)); opacity:.10; }
  .stat-card .num { font-size:30px; font-weight:800; font-family:var(--font-serif); color:var(--c, var(--accent)); }
  .stat-card .lab { font-size:12px; color:var(--text-secondary); letter-spacing:.06em; }
  .stat-card .trend { font-size:11px; color:var(--text-tertiary); }

  /* 柱状图 */
  /* 近七日趋势折线图 */
  .trend { height:170px; padding-top:8px; position:relative; }
  .trend svg { width:100%; height:100%; display:block; }
  .trend .trend-axis { display:flex; justify-content:space-between; margin-top:-2px; }
  .trend .trend-axis span { font-size:10.5px; color:var(--text-tertiary); }

  /* 横条排行 */
  .hbars { display:flex; flex-direction:column; gap:12px; }
  .hbare { display:flex; align-items:center; gap:10px; }
  .hbare .hb-name { flex:0 0 86px; font-size:12.5px; font-weight:600; color:var(--text); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hbare .hb-track { flex:1; height:18px; background:var(--surface-nested); border-radius:6px; overflow:hidden; }
  .hbare .hb-fill { height:100%; border-radius:6px; background:linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 40%, transparent)); }
  .hbare .hb-num { flex:0 0 30px; font-size:11.5px; color:var(--text-tertiary); }

  /* 环形图容器 */
  .donut-wrap { display:flex; align-items:center; gap:18px; }

  /* 词云 */

    opacity:.82; transition:transform var(--dur) var(--ease); }
  .cloud .cw:hover { transform:scale(1.12); opacity:1; }
  [data-theme="dark"] .cloud .cw { color:var(--drawer-text); }

  /* 卡片(词句组) */
  .sent-group { display:flex; flex-direction:column; gap:16px; }
  .group-card { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
    box-shadow:var(--shadow-card); overflow:hidden; animation:contentFade var(--dur) var(--ease); }
  .gc-head { display:flex; align-items:center; gap:10px; padding:13px 18px; border-bottom:1px solid var(--border); background:var(--surface-nested); }

  .gc-count { margin-left:auto; font-size:12px; color:var(--text-secondary); }
  .gc-body { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1px; background:var(--border); }
  .sent { display:flex; align-items:flex-start; gap:12px; background:var(--surface-card); padding:15px 18px; border-left:3px solid transparent;
    transition:all var(--dur) var(--ease); }
  .sent:hover { border-left-color:var(--accent); background:var(--surface-nested); }
  .sent .txt { font-size:14.5px; line-height:1.75; font-family:var(--font-serif); flex:1; min-width:0; }
  .sent .meta { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .sent .src { font-size:11.5px; color:var(--text-secondary); }
  .sent .tags { display:flex; gap:6px; flex-wrap:wrap; }
  .tag-mini { padding:3px 10px; border-radius:999px; font-size:11px; color:#fff; font-weight:600;

  .sent .txt { cursor:pointer; }
  .icon-btn.note-on { color:var(--accent); }
  .tag-mini.note-tag { background:color-mix(in srgb, var(--text-tertiary) 16%, var(--surface-nested));
    color:var(--text-secondary); box-shadow:none; }
  .icon-btn { width:28px; height:28px; border-radius:8px; display:grid; place-items:center; color:var(--text-tertiary);
    transition:all var(--dur) var(--ease); border:none; background:transparent; cursor:pointer; }
  .icon-btn:hover { background:var(--surface-nested); color:var(--accent); }
  .icon-btn.liked { color:#e05555; }
  .icon-btn svg { width:16px; height:16px; }

  /* 札记 */
  .note-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .note-item { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);

  .note-item:hover { transform:translateY(-2px); border-color:var(--accent); }
  .note-item .n-title { font-size:15px; font-weight:700; font-family:var(--font-serif); }
  .note-item .n-time { font-size:11.5px; color:var(--text-tertiary); margin-top:4px; }
  .note-item .n-preview { font-size:13px; color:var(--text-secondary); margin-top:8px; line-height:1.6;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* 句随笔 */
  .sent-note-view { padding:14px 16px; border:1px solid var(--border); border-left:3px solid var(--accent);
    border-radius:var(--radius-control); background:var(--surface-nested); font-family:var(--font-serif); font-size:14px; line-height:1.8; color:var(--text); }
  .sent-note-view .sn-meta { font-size:11.5px; color:var(--text-tertiary); margin-top:8px; }

  /* 印鉴管理 */
  .tag-list { display:flex; flex-direction:column; gap:12px; }
  .tag-item { display:flex; align-items:center; gap:12px; padding:14px 18px; background:var(--surface-card);
    border:1px solid var(--border); border-radius:var(--radius-tile); }
  .tag-item .t-dot { width:14px; height:14px; border-radius:4px; }
  .tag-item .t-name { font-size:14px; font-weight:600; }
  .tag-item .t-count { font-size:12px; color:var(--text-secondary); margin-left:auto; }

  /* 表单 / 按钮 / 搜索 */
  .label { font-size:12.5px; font-weight:600; color:var(--text-secondary); display:block; margin-bottom:6px; }
  .input, textarea.input { width:100%; padding:10px 14px; border:1px solid var(--border-input); border-radius:var(--radius-control);
    background:var(--surface-card); color:var(--text); font-size:13.5px; font-family:inherit; outline:none; transition:border-color var(--dur) var(--ease); }
  .input:focus { border-color:var(--accent); }
  textarea.input { resize:vertical; min-height:80px; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:var(--radius-control);
    font-size:13px; font-weight:600; cursor:pointer; transition:all var(--dur) var(--ease);
    border:1px solid var(--border); background:var(--surface-card); color:var(--text); }
  .btn:hover { background:var(--surface-nested); }
  .btn.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .btn.primary:hover { opacity:.9; }
  .btn svg { width:16px; height:16px; }
  .chip { display:inline-flex; align-items:center; gap:4px; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:600;

  .chip:hover { border-color:var(--accent); color:var(--accent); }

  /* 悬浮 AI */
  .ai-fab { position:fixed; right:22px; bottom:22px; border:none; background:transparent; padding:0; cursor:pointer;
    display:block; line-height:0; color:#fff; z-index:9000;

  .ai-fab:hover { transform:translateY(-2px) scale(1.05); }
  .ai-fab img { width:52px; height:52px; object-fit:contain; display:block; }
  .ai-fab .dot { position:absolute; top:6px; right:6px; width:11px; height:11px; border-radius:50%; background:#5ee0a0;
    box-shadow:0 0 0 2px color-mix(in srgb, var(--surface) 90%, transparent); }

  .ai-panel { position:fixed; right:24px; bottom:92px; z-index:9500; width:400px; max-width:calc(100vw - 24px); height:620px; max-height:calc(100vh - 88px);
    display:flex; flex-direction:column; background:var(--surface-card); border:1px solid var(--border);
    border-radius:var(--radius-sheet); box-shadow:var(--shadow-overlay); overflow:hidden; opacity:0; transform:scale(.96) translateY(6px); pointer-events:none;
    transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
  .ai-panel::before { content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--grad-accent, linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 35%, transparent))); z-index:2; }
  .ai-panel.on { opacity:1; transform:scale(1) translateY(0); pointer-events:auto; }

  .ai-head:active { cursor:grabbing; }
  .ai-head .ai-title { font-size:14px; font-weight:800; font-family:var(--font-serif); flex:1; display:flex; align-items:center; gap:8px; }
  .ai-head .ai-title .ldot { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .ai-head .icon-btn { width:26px; height:26px; }

  .msg.user { align-self:flex-end; background:var(--accent); color:var(--on-accent); border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:var(--surface-nested); border-bottom-left-radius:4px; }

  .msg.bot pre { background:var(--drawer-bg-top); color:var(--drawer-text); padding:10px; border-radius:8px; overflow-x:auto; margin:8px 0; font-size:12px; }
  .msg.bot h3, .msg.bot h4 { margin:8px 0 4px; font-family:var(--font-serif); }

  .msg.bot ul, .msg.bot ol { margin:4px 0 4px 18px; }
  .msg.bot blockquote { border-left:3px solid var(--accent); padding-left:10px; color:var(--text-secondary); margin:6px 0; }
  .msg.bot a { color:var(--accent); }

  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
  .ai-in { display:flex; gap:8px; padding:12px; border-top:1px solid var(--border); background:var(--surface-card); }
  .ai-in textarea { flex:1; resize:none; border:1px solid var(--border-input); border-radius:var(--radius-control);

  .ai-in .btn { height:44px; padding:0 16px; }

  .ai-hint span { max-width:260px; line-height:1.7; }
  .ai-hint .ai-starts { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:320px; }
  .ai-hint .ai-starts .btn { border-radius:999px; font-size:12px; padding:6px 14px; }

  /* AI 设置页 */
  .field-box { display:flex; flex-direction:column; gap:16px; max-width:560px; }
  .field-box .row2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .field-box .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .ai-cfg-grid { display:grid; grid-template-columns:minmax(0,560px) minmax(0,1fr); gap:18px; align-items:start; }
  .prompt-card { border:1px solid var(--border); border-radius:12px; background:var(--surface-card); padding:10px 12px; }

  .search-box svg { color:var(--text-tertiary); }
  .seg { display:flex; background:var(--surface-nested); border-radius:var(--radius-control); padding:3px; gap:2px; }

  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; color:var(--text-tertiary); gap:8px; }

    .main { padding:18px 18px 60px; }
  }
