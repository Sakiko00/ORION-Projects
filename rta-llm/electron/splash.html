<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTA-LLM</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #060B14;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    -webkit-app-region: drag;
    user-select: none;
  }
  .splash {
    text-align: center;
    padding: 40px;
    border-radius: 24px;
    background: linear-gradient(145deg, rgba(6,182,212,0.08) 0%, rgba(20,184,166,0.05) 100%);
    border: 1px solid rgba(6,182,212,0.15);
    box-shadow: 0 0 60px rgba(6,182,212,0.1);
    width: 440px;
  }
  .logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #06B6D4, #14B8A6);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 30px rgba(6,182,212,0.3);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 30px rgba(6,182,212,0.3); }
    50% { box-shadow: 0 0 50px rgba(6,182,212,0.5); }
  }
  .logo svg { width: 40px; height: 40px; }
  h1 {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #06B6D4, #22D3EE);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  .subtitle {
    font-size: 13px;
    color: #64748B;
    margin-bottom: 28px;
    letter-spacing: 1px;
  }
  .loading-bar {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .loading-fill {
    height: 100%;
    background: linear-gradient(90deg, #06B6D4, #14B8A6, #06B6D4);
    background-size: 200% 100%;
    border-radius: 2px;
    animation: loading 2s ease-in-out infinite;
    width: 40%;
  }
  @keyframes loading {
    0% { width: 10%; }
    50% { width: 70%; }
    100% { width: 10%; }
  }
  .status {
    font-size: 12px;
    color: #06B6D4;
    letter-spacing: 0.5px;
    animation: fadeText 2s ease-in-out infinite;
  }
  @keyframes fadeText {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
<div class="splash">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/>
      <line x1="12" y1="22" x2="12" y2="15.5"/>
      <polyline points="22 8.5 12 15.5 2 8.5"/>
      <polyline points="2 15.5 12 8.5 22 15.5"/>
      <circle cx="12" cy="12" r="2" fill="white"/>
    </svg>
  </div>
  <h1>RTA-LLM</h1>
  <p class="subtitle">反思性主体分析 · AI 质性研究工具</p>
  <div class="loading-bar"><div class="loading-fill"></div></div>
  <p class="status">正在启动服务...</p>
</div>
</body>
</html>
